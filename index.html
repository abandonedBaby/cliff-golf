<style>

<body>
<canvas id="c"></canvas>
<div id="hint">drag DOWN from the ball to aim &amp; power up — release to launch · mouse wheel to peek · tap the spin icon under the ball · drag back up (or Esc) to cancel a shot · R = re-drop · mind the birds &amp; wind</div>
<div id="brand"><b>abandonedBaby GAMES</b> · © 2026</div>

<div id="panel" role="dialog" aria-modal="true" aria-labelledby="pTitle">
  <div class="card">
    <button id="pClose" aria-label="Close">×</button>
    <h1 id="pTitle">SUMMIT REACHED</h1>
    <p class="sub" id="pSub"></p>
    <div id="entry">
      <input id="pName" maxlength="12" placeholder="YOUR NAME" autocomplete="off"
             autocapitalize="characters" spellcheck="false" aria-label="Your name">
      <button id="pSave">SAVE</button>
    </div>
    <ol id="pBoard"></ol>
    <div class="row">
      <button id="pShare">SHARE BADGE</button>
      <button id="pAgain">PLAY AGAIN</button>
    </div>
    <p id="pNote"></p>
    <div class="bl">abandonedBaby GAMES</div>
  </div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
// VW is the fixed width of the play column in world units — level design depends on
// it, so it never changes. Everything else is derived from the actual viewport:
//   VH  = how much world height fits on this screen
//   VX0 = leftmost visible world x (negative when the screen is wider than the column)
//   VWF = total visible world width, backdrop and HUD span this so nothing is letterboxed
const VW = 480;
let VH = 720, VX0 = 0, VWF = 480, SCALE = 1;
// WH runs well below the floor so the camera can always scroll far enough past the
// tee to leave a full pull-length of screen under the ball. Set once the climb has
// been generated, since the world's height depends on how many tiers it produced.
const WW = 480;
let WH = 4720;
const GRAV = 0.34, AIRDRAG = 0.999;
const R = 8;                         // ball radius
// shorter pull, proportionally stronger — same 18.6 max launch speed, less mouse travel
const MAXPULL = 150, POWER = 0.124;

// deterministic value noise — declared up here because hole and scenery placement
// both need it, and those run before the drawing section
const hsh = n => { const v = Math.sin(n*127.1)*43758.5453; return v - Math.floor(v); };
// scenery list — declared up here because reset() re-seeds it during load
const TREES = [];

// ---------------------------------------------------------------- level data
// types: g=grass/rock  s=sand  w=water  tg=tall grass  r=sloped ramp
const B = [];
const g=(x,y,w,h)=>B.push({x,y,w,h:h||18,t:'g'});

// A hazard set into a ledge, with the ground wrapping up around both ends so it
// sits in a walled basin instead of floating on the surface.
function pit(x,y,w,t){
  const hh = t==='w' ? 10 : 13;                  // hazard depth
  B.push({x, y:y-hh, w, h:hh+8, t});             // hazard, sunk into the ledge top
  B.push({x:x-5, y:y-hh-5, w:5, h:hh+5, t:'g'}); // left lip
  B.push({x:x+w, y:y-hh-5, w:5, h:hh+5, t:'g'}); // right lip
}
// Sloped ramp. dir=+1 rises to the right, dir=-1 falls to the right.
// Surface runs corner to corner; a solid base sits under the low edge.
function ramp(x,y,w,h,dir){
  B.push({x,y,w,h,t:'r',dir});
  g(x, y+h, w, 12);
  B[B.length-1].base = true;      // support block: no grass cap, no trees
}

// ---------------------------------------------------------------- generation
// The climb is built procedurally from a FIXED seed, so the mountain is the same
// every session — only the pin positions move run to run. Three biomes stack up
// it: desert at the base, green belt in the middle, snow and ice at the summit.
let _seed = 20260726;
const rnd = () => { _seed = (_seed*1664525 + 1013904223) >>> 0; return _seed/4294967296; };
const rr = (a,b) => a + rnd()*(b-a);

const TIER_N = 27, SUMMIT_Y = 300;
const TIER_Y = [];
(function stackTiers(){
  let y = SUMMIT_Y;
  TIER_Y[TIER_N-1] = y;
  for(let i=TIER_N-2;i>=0;i--){ y += 188 + Math.round(rnd()*46); TIER_Y[i] = y; }
})();
const GROUND_Y = TIER_Y[0] + 200;
const CLIMB = GROUND_Y - SUMMIT_Y;
WH = GROUND_Y + 420;                 // bedrock bottom = world bottom

// 0 at the tee, 1 at the summit
const altOf = y => Math.max(0, Math.min(1, (GROUND_Y - y)/CLIMB));
const biomeOf = y => { const f = altOf(y); return f < 0.36 ? 'desert' : f < 0.72 ? 'green' : 'alpine'; };
const SNOWLINE = GROUND_Y - CLIMB*0.72;         // alpine starts here

function hazardFor(bio){
  const r = rnd();
  if(bio === 'desert') return r < 0.72 ? 's'    : r < 0.88 ? 'tg'  : 'w';
  if(bio === 'green')  return r < 0.40 ? 'w'    : r < 0.74 ? 'tg'  : 's';
  return                      r < 0.50 ? 'snow' : r < 0.90 ? 'ice' : 'w';
}
function overlapsAny(x,y,w,h,pad){
  return B.some(b => !b.wall && x < b.x+b.w+pad && x+w+pad > b.x &&
                              y < b.y+b.h+pad && y+h+pad > b.y);
}

// ground: floor overhangs the walls, and the walls run far above the summit —
// otherwise a big shot off the top tier sails over them and is lost forever.
g(-60, GROUND_Y, 600, 420);
g(-30, SUMMIT_Y-3200, 30, CLIMB+7000); g(480, SUMMIT_Y-3200, 30, CLIMB+7000);
B[B.length-1].wall = B[B.length-2].wall = true;

// Each tier gets one "pin ledge" sitting exactly on the tier line (cups are only
// ever placed there) plus a couple of jittered neighbours to bounce around on.
const PIN_LEDGE = [];
for(let i=0;i<TIER_N;i++){
  const ty = TIER_Y[i], bio = biomeOf(ty);
  const n = rnd() < 0.45 ? 2 : 3;
  const slot = 480/n, pinSlot = Math.floor(rnd()*n);
  for(let k=0;k<n;k++){
    const isPin = k === pinSlot;
    const w = Math.round(rr(isPin ? 104 : 78, isPin ? 156 : 140));
    const lo = k*slot + 6, hi = k*slot + slot - w - 6;
    const x = Math.round(hi > lo ? rr(lo, hi) : lo);
    const yy = isPin ? ty : ty + Math.round(rr(-38, 38));
    g(x, yy, w);
    if(isPin) PIN_LEDGE[i] = {x, y:ty, w};
    // hazard basin — only where it still leaves room for a cup and a run-up
    if(isPin){
      // a pin ledge may only carry a hazard tucked against one end, sized to leave
      // a clear 100px of bare ledge for the cup and its run-up
      const hw = Math.min(70, w - 106);
      if(hw >= 32 && rnd() < 0.45){
        const hx = rnd() < 0.5 ? x+8 : x+w-hw-8;
        pit(Math.round(hx), yy, Math.round(hw), hazardFor(bio));
      }
    } else {
      const room = w - 66;
      if(room >= 34 && rnd() < 0.62){
        const hw = Math.round(rr(32, Math.min(78, room)));
        const hx = Math.round(rr(x+8, x+w-hw-8));
        pit(hx, yy, hw, hazardFor(bio));
      }
    }
    // a kicker ramp off the right end now and then, if there is clear air for it.
    // Start one pixel clear of this ledge, or it always collides with its own parent.
    if(!isPin && rnd() < 0.34 && x+w+62 < 474 && !overlapsAny(x+w+1, yy-40, 60, 52, 0)){
      ramp(x+w+1, yy-40, 60, 40, 1);
    }
  }
}

// ------------------------------------------------------------------- holes
// One cup per tier, re-drawn at the start of every run. A candidate x only
// qualifies if it sits on the pin ledge, well inside the ends, clear of hazards,
// basin lips and ramps, and with a clear run-up from at least one side — so a
// random layout is always still puttable.
let HOLES = TIER_Y.map((y,i) => ({x: PIN_LEDGE[i].x + PIN_LEDGE[i].w/2, y}));

// anything that isn't plain walkable ledge near this point?
function cupBlocked(px, ty){
  return B.some(b => {
    if(b.wall) return false;
    const plain = (b.t === 'g' && !b.base && b.w >= 24);
    if(plain) return false;                       // ordinary ledge is fine
    return px > b.x-15 && px < b.x+b.w+15 && Math.abs(b.y-ty) < 42;
  });
}
function cupCandidates(ty){
  const cands = [];
  for(const b of B){
    if(b.t !== 'g' || b.wall || b.base || b.w < 58) continue;
    if(Math.abs(b.y - ty) > 0.5) continue;
    for(let x = b.x+18; x <= b.x+b.w-18; x += 4){
      if(cupBlocked(x, ty)) continue;
      // need 34px of clean approach on at least one side, inside this ledge
      const runL = x-34 >= b.x && !cupBlocked(x-20, ty) && !cupBlocked(x-34, ty);
      const runR = x+34 <= b.x+b.w && !cupBlocked(x+20, ty) && !cupBlocked(x+34, ty);
      if(runL || runR) cands.push(x);
    }
  }
  return cands;
}
function pickCup(ty){
  const cands = cupCandidates(ty);
  if(!cands.length) return null;
  return {x: cands[(Math.random()*cands.length)|0], y: ty};
}

// Guarantee every tier can hold a legal cup. If a hazard has boxed in a pin ledge
// despite the sizing rules, strip it off that ledge — a tier with nowhere to put
// the pin would otherwise drop the cup onto sand or water.
(function guaranteeCups(){
  for(let i=0;i<TIER_N;i++){
    if(cupCandidates(TIER_Y[i]).length) continue;
    const pl = PIN_LEDGE[i];
    for(let k=B.length-1;k>=0;k--){
      const b = B[k];
      if(b.wall || b.base) continue;
      const onPin = b.x >= pl.x-8 && b.x+b.w <= pl.x+pl.w+8 && Math.abs(b.y-pl.y) < 34;
      if(onPin && (b.t !== 'g' || b.w <= 6)) B.splice(k,1);   // hazard body or its lips
    }
  }
})();
function pickHoles(){
  // falls back to the middle of the tier's pin ledge, which always exists
  HOLES = TIER_Y.map((ty,i) => pickCup(ty) ||
    {x: Math.round(PIN_LEDGE[i].x + PIN_LEDGE[i].w/2), y: ty});
}

const TEE = {x: 60, y: GROUND_Y - R};

// ------------------------------------------------------------- leaderboard
// Local to this browser (localStorage). It is golf: FEWER strokes wins, so the
// board sorts ascending. Only runs completed to the summit qualify — otherwise an
// abandoned run with 3 strokes would sit at the top forever.
const LS_SCORES = 'cliffgolf.scores.v1', LS_NAME = 'cliffgolf.name', BOARD_MAX = 10;
function storageOK(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }                 // private mode, or file:// in some browsers
}
function loadScores(){
  try{
    const a = JSON.parse(localStorage.getItem(LS_SCORES) || '[]');
    return Array.isArray(a) ? a.filter(r => r && typeof r.s === 'number' && isFinite(r.s)) : [];
  }catch(e){ return []; }
}
function addScore(name, strokes){
  const a = loadScores();
  const clean = String(name||'').trim().toUpperCase().replace(/\s+/g,' ').slice(0,12);
  const row = {n: clean || 'PLAYER', s:strokes, d:Date.now()};
  a.push(row);
  a.sort((x,y) => x.s - y.s || x.d - y.d);  // fewest strokes first, earliest breaks ties
  const top = a.slice(0, BOARD_MAX);
  try{ localStorage.setItem(LS_SCORES, JSON.stringify(top)); }catch(e){}
  try{ localStorage.setItem(LS_NAME, row.n); }catch(e){}
  return {top, row};
}
function savedName(){ try{ return localStorage.getItem(LS_NAME) || ''; }catch(e){ return ''; } }

// -------------------------------------------------------------------- wind
// Bands of moving air sitting in the gaps between tiers. They push the ball
// sideways while it is in flight only — a resting ball is never moved. Strength
// climbs as you get higher, and directions alternate so you must read each gap.
// Generated into the gaps between tiers. Desert bands are dust storms, the summit
// gets driving snow; strength climbs with altitude and directions alternate.
const WINDS = [];
(function blowWind(){
  let dir = 1;
  for(let i=1;i<TIER_N;i+=2){
    const top = TIER_Y[i] + 52, bot = TIER_Y[i-1] - 58;
    const h = bot - top;
    if(h < 70) continue;
    const f = altOf(top);
    const full = rnd() < 0.55;
    const w = full ? 480 : Math.round(rr(280, 420));
    const x = full ? 0 : Math.round(rr(0, 480-w));
    WINDS.push({x, y:top, w, h:Math.min(h,170),
      ax: dir*(0.045 + f*0.09), bio: biomeOf(top)});
    dir = -dir;
  }
})();
function windAt(x,y){
  let ax = 0;
  for(const w of WINDS)
    if(x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) ax += w.ax;
  return ax;
}

// -------------------------------------------------------------------- birds
// patrol the open air between ledges — clip one mid-flight and your shot is done for
// [xLeft, xRight, y, speed, bobAmount]
const BIRDS = [];
const bird=(x0,x1,y,sp,bob,bio)=>BIRDS.push({x0,x1,y,sp,bob:bob||8,bio:bio||'green',
  t:Math.random(), dir:Math.random()<0.5?-1:1, flap:Math.random()*6, oy:0, stun:0, x:x0, cy:y});
(function flock(){
  for(let i=1;i<TIER_N;i++){
    const y = Math.round((TIER_Y[i] + TIER_Y[i-1])/2);
    const bio = biomeOf(y);
    // sparse over the desert (a lone circling vulture), busiest through the green belt
    if(bio === 'desert' && rnd() < 0.55) continue;
    if(bio === 'alpine' && rnd() < 0.25) continue;
    const w = Math.round(rr(230, 300));
    const x0 = Math.round(rr(10, 480-w-10));
    bird(x0, x0+w, y, +rr(0.5, 0.8 + altOf(y)*0.9).toFixed(2),
         Math.round(rr(8, 22)), bio);
  }
})();

function resetBirds(){
  for(const b of BIRDS){ b.stun = 0; b.oy = 0; b.t = Math.random(); }
}
function birdPos(b){
  b.x = b.x0 + (b.x1-b.x0)*b.t;
  b.cy = b.y + Math.sin(perf/420 + b.flap)*b.bob + b.oy;
}
function stepBirds(){
  for(const b of BIRDS){
    const span = b.x1-b.x0;
    if(b.stun > 0){                       // knocked loose — flutter up out of play
      b.stun--; b.oy -= 1.4;
      if(b.stun === 0) b.oy = 0;
    } else if(b.oy < 0){                  // glide back down to the patrol lane
      b.oy = Math.min(0, b.oy + 1.1);
    }
    b.t += (b.sp/span)*b.dir;
    if(b.t > 1){ b.t = 1; b.dir = -1; }
    if(b.t < 0){ b.t = 0; b.dir =  1; }
    b.flap += 0.22;
    birdPos(b);
  }
}
function hitBirds(){
  if(ball.rest) return;
  for(const b of BIRDS){
    if(b.stun > 0 || b.oy < -2) continue;
    const dx = ball.x-b.x, dy = ball.y-b.cy;
    const rad = R + 10;
    if(dx*dx+dy*dy > rad*rad) continue;
    const d = Math.hypot(dx,dy) || 0.001;
    const nx = dx/d, ny = dy/d;
    ball.x = b.x + nx*rad; ball.y = b.cy + ny*rad;
    const vn = ball.vx*nx + ball.vy*ny;
    if(vn < 0){ ball.vx -= 1.7*vn*nx; ball.vy -= 1.7*vn*ny; }
    ball.vx = ball.vx*0.62 + b.dir*0.8;   // bird shoves you off your line
    ball.vy *= 0.62;
    b.stun = 70; b.dir = -b.dir;
    flash('THWACK! bird strike');
    return;
  }
}
function drawBirds(){
  for(const b of BIRDS){
    const y = b.cy-cam;
    if(y < -40 || y > VH+40) continue;
    const face = b.dir;
    const wing = Math.sin(b.flap)*7;
    ctx.save(); ctx.translate(b.x, y); ctx.scale(face, 1);
    // wings
    ctx.strokeStyle = b.stun>0 ? '#8a5a5a' : '#3a4256';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, -wing*0.5); ctx.lineTo(-2, 0); ctx.lineTo(9, -wing*0.5);
    ctx.stroke();
    // body
    ctx.fillStyle = b.stun>0 ? '#a86a6a' : '#4a5470';
    ctx.beginPath(); ctx.ellipse(0, 1, 8, 5, 0, 0, 7); ctx.fill();
    // head + beak
    ctx.beginPath(); ctx.arc(6, -3, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb02e';
    ctx.beginPath(); ctx.moveTo(9,-3); ctx.lineTo(15,-1.5); ctx.lineTo(9,0); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7.5, -4, 1.3, 0, 7); ctx.fill();
    ctx.restore();
    if(b.stun > 0){                        // dazed stars
      ctx.fillStyle = '#ffd23f';
      for(let i=0;i<3;i++){
        const a = perf/120 + i*2.1;
        ctx.fillRect(b.x + Math.cos(a)*11 - 1, y - 13 + Math.sin(a)*4, 2, 2);
      }
    }
  }
}

// -------------------------------------------------------------------- state
let ball, hole, strokes, total, cam, camPeek, aiming, aimFrom, mouse, done, msg, msgT;
let restartArm = 0;                  // declared here: reset() runs before the input section
let introT = 170;                    // studio card frames remaining on first load
let panelUp = false, scoreSaved = false, lastRank = -1;   // same reason — reset() touches these
// side spin: sign = direction, magnitude = level (1 low, 2 high), 0 = straight
let spinSel = 0, spinMenu = false;
const SPIN_ACC = [0, 0.05, 0.105];
const SPIN_NAME = ['', 'LOW', 'HIGH'];
// hoisted + no helpers, so reset() can call it safely during load
function hidePanel(){
  const p = document.getElementById('panel');
  if(p) p.classList.remove('on');
  panelUp = false;
}

function reset(){
  hole = 0; strokes = 0; total = 0; done = false; camPeek = 0; msg=''; msgT=0;
  restartArm = 0; aiming = false;
  scoreSaved = false; lastRank = -1; hidePanel();
  pickHoles(); seedTrees();            // fresh pin placement every run
  resetBirds();
  respawn(TEE.x, TEE.y);
  cam = ball.y - VH*0.65;
}
function respawn(x,y){
  ball = {x, y, vx:0, vy:0, rest:true, sand:false, spin:0, curve:0};
  ball.homeX = x; ball.homeY = y;
  spinMenu = false;
}
reset();

// -------------------------------------------------------------------- input
function toWorld(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  // clamped to the visible area so a drag that runs past the screen edge still reads cleanly
  const s = toScreen(e);
  return { x: Math.max(VX0, Math.min(VX0+VWF, s.x)),
           y: Math.max(0, Math.min(VH, s.y)) + cam };
}
// screen space: world units, but without the camera offset (what the HUD is drawn in)
function toScreen(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches && e.touches[0] ? e.touches[0]
          : (e.changedTouches && e.changedTouches[0] ? e.changedTouches[0] : e);
  return { x: VX0 + (p.clientX-r.left)/SCALE, y: (p.clientY-r.top)/SCALE };
}
// Restart button, top-right of the HUD bar. Needs a second tap to confirm so a
// misplaced touch can never wipe a run in progress.
function btnRect(){ return {x: VX0+VWF-40, y: 4, w: 34, h: 26}; }
function boardRect(){ return {x: VX0+VWF-80, y: 4, w: 34, h: 26}; }

// Spin control: a single button under the ball that opens a left/right × low/med/high
// menu. Everything here is in screen space (world x, camera-relative y), which is
// what toScreen gives us, so hit tests and drawing share the same coordinates.
function spinBtn(){ return {cx: ball.x, cy: ball.y - cam + 40, r: 15}; }
function spinCells(){
  const b = spinBtn(), cw = 40, ch = 34, gap = 5, clearW = 30;
  const rowW = 2*cw + gap;
  const total = rowW + gap + clearW;
  const x0 = Math.max(VX0+6, Math.min(VX0+VWF-total-6, b.cx - total/2));
  const y0 = b.cy + 17;
  const cells = [];
  for(let lvl=1; lvl<=2; lvl++){
    cells.push({x:x0+(lvl-1)*(cw+gap), y:y0,        w:cw, h:ch, val:-lvl});
    cells.push({x:x0+(lvl-1)*(cw+gap), y:y0+ch+gap, w:cw, h:ch, val: lvl});
  }
  cells.push({x:x0+rowW+gap, y:y0, w:clearW, h:ch*2+gap, val:0});   // straight / clear
  return cells;
}
function spinUIVisible(){ return ball && ball.rest && !done && !panelUp; }
// returns true if the tap was consumed by the spin control
function spinTap(s){
  if(!spinUIVisible()) return false;
  const b = spinBtn();
  // tight hit area: the button sits inside the ball's aim radius, so any slack here
  // steals presses that were meant to start a drag
  if(Math.hypot(s.x-b.cx, s.y-b.cy) < b.r+2){ spinMenu = !spinMenu; return true; }
  if(spinMenu){
    for(const c of spinCells()){
      if(s.x>c.x && s.x<c.x+c.w && s.y>c.y && s.y<c.y+c.h){
        spinSel = c.val; spinMenu = false;
        flash(c.val ? (c.val<0?'LEFT':'RIGHT')+' SPIN '+SPIN_NAME[Math.abs(c.val)] : 'NO SPIN');
        return true;
      }
    }
    spinMenu = false;                    // tapped away — close, then handle normally
  }
  return false;
}
function hits(s, b){
  return s.x > b.x-6 && s.x < b.x+b.w+6 && s.y > b.y-4 && s.y < b.y+b.h+6;
}
function inBtn(s){ return hits(s, btnRect()); }
function down(e){
  e.preventDefault();
  introT = 0;                                      // any touch skips the studio card
  const s = toScreen(e);
  if(hits(s, boardRect())){ restartArm = 0; openPanel(false); return; }
  if(inBtn(s)){
    if(restartArm > 0){ restartArm = 0; reset(); flash('RESTARTED'); }
    else { restartArm = 180; flash('TAP AGAIN TO RESTART'); }
    return;
  }
  restartArm = 0;                                  // tapping elsewhere cancels
  if(done) return;                                 // end panel owns the finished state
  if(spinTap(s)) return;                           // spin button / menu
  const m = toWorld(e);
  if(!atRest()) return;
  if(Math.hypot(m.x-ball.x, m.y-ball.y) < 42){ aiming = true; aimFrom = m; mouse = m; }
}
function move(e){ if(aiming){ e.preventDefault(); mouse = toWorld(e); } }
// A pulled-back shot is aimed by dragging DOWN, so dragging back up past the ball
// is never a shot anyone wants — that gesture cancels instead. Esc and right-click
// do the same for mouse players.
function cancelZone(){ return mouse && mouse.y < ball.y - 14; }
function cancelShot(){
  if(!aiming) return;
  aiming = false; flash('SHOT CANCELLED');
}
function up(e){
  if(!aiming) return;
  if(cancelZone()){ cancelShot(); return; }
  aiming = false;
  const v = pull();
  if(v.len < 12) return;
  ball.vx = -v.dx*POWER; ball.vy = -v.dy*POWER;
  ball.curve = Math.sign(spinSel) * SPIN_ACC[Math.abs(spinSel)];
  ball.rest = false; strokes++; total++; camPeek = 0; spinMenu = false;
}
function pull(){
  let dx = mouse.x-ball.x, dy = mouse.y-ball.y;
  let len = Math.hypot(dx,dy);
  if(len > MAXPULL){ dx *= MAXPULL/len; dy *= MAXPULL/len; len = MAXPULL; }
  return {dx,dy,len};
}
cv.addEventListener('mousedown',down); cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); camPeek += e.deltaY*0.6;
  camPeek = Math.max(-1200, Math.min(600, camPeek)); },{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='Escape' && aiming){ cancelShot(); return; }
  if(e.key==='r'||e.key==='R'){ respawn(ball.homeX, ball.homeY); strokes++; total++; }
});
cv.addEventListener('contextmenu',e=>{           // right-click also cancels
  if(aiming){ e.preventDefault(); cancelShot(); }
});

function atRest(){ return ball.rest; }

// ------------------------------------------------------------------ physics
function step(){
  if(done) return;
  stepBirds();
  if(ball.rest){ tugCam(); return; }

  ball.vy += GRAV;
  ball.vx += windAt(ball.x, ball.y);
  ball.vx += ball.curve;                 // side spin bends the flight
  ball.curve *= 0.985;                   // and bleeds off as the ball travels
  ball.vx *= AIRDRAG; ball.vy *= AIRDRAG;

  // substep for tunnelling
  const n = Math.max(1, Math.ceil(Math.hypot(ball.vx,ball.vy)/4));
  for(let i=0;i<n;i++){
    ball.x += ball.vx/n; ball.y += ball.vy/n;
    collide();
    hitBirds();
    fellBack();
    if(done || ball.rest) return;
  }
  edgeGrip();
  if(onGround()) ball.curve *= 0.90;     // scrubs off fast once it's rolling
  ball.spin += ball.vx*0.06 + ball.curve*2.2;

  // settle — the slow-frame counter is a backstop so a ball nudging along a slope
  // or wedged in a basin can never leave the player unable to take a shot
  const sp = Math.hypot(ball.vx, ball.vy);
  ball.slow = sp < 0.5 ? (ball.slow||0)+1 : 0;
  if((sp < 0.34 && onGround()) || ball.slow > 50){
    ball.vx = ball.vy = 0; ball.rest = true; ball.slow = 0;
    ball.homeX = ball.x; ball.homeY = ball.y;
  }
  sink();
  tugCam();
}

// sand, tall grass and deep snow all kill momentum; ice does the opposite
const STICKY = t => t==='s' || t==='tg' || t==='snow';
const rampY = (b,x) => {                          // surface height at a given x
  const u = Math.max(0, Math.min(1, (x-b.x)/b.w));
  return b.dir > 0 ? b.y + b.h*(1-u) : b.y + b.h*u;
};

function onGround(){
  for(const b of B){
    if(b.t==='w') continue;
    if(ball.x < b.x-R || ball.x > b.x+b.w+R) continue;
    if(b.t==='r'){ if(Math.abs((ball.y+R) - rampY(b,ball.x)) < 4) return true; continue; }
    if(Math.abs((ball.y+R) - b.y) < 1.6) return true;
  }
  return false;
}

function collide(){
  ball.sand = false;
  for(const b of B){
    if(b.t==='r'){ rampCollide(b); continue; }
    const cx = Math.max(b.x, Math.min(ball.x, b.x+b.w));
    const cy = Math.max(b.y, Math.min(ball.y, b.y+b.h));
    const dx = ball.x-cx, dy = ball.y-cy, d2 = dx*dx+dy*dy;
    if(d2 > R*R) continue;

    if(b.t==='w'){ splash(); return; }

    let d = Math.sqrt(d2) || 0.0001;
    let nx = dx/d, ny = dy/d;
    if(d2 < 0.0001){ ny = -1; nx = 0; }           // deep overlap → push up
    const pen = R-d;
    ball.x += nx*pen; ball.y += ny*pen;

    const vn = ball.vx*nx + ball.vy*ny;
    if(vn < 0){
      const bounce = STICKY(b.t) ? 0.06 : b.t==='ice' ? 0.52 : 0.44;
      ball.vx -= (1+bounce)*vn*nx;
      ball.vy -= (1+bounce)*vn*ny;
    }
    // tangential friction — ice is near frictionless, snow swallows the ball
    const f = b.t==='s'    ? 0.55
            : b.t==='tg'   ? 0.66
            : b.t==='snow' ? 0.60
            : b.t==='ice'  ? 0.999
            : 0.985;
    const tx = -ny, ty = nx;
    let vt = ball.vx*tx + ball.vy*ty;
    const nvt = vt*f;
    ball.vx += (nvt-vt)*tx; ball.vy += (nvt-vt)*ty;
    if(STICKY(b.t)) ball.sand = true;
  }
}

// Ledge rims grab at a ball that is trickling toward the drop: a little extra drag
// plus a gentle inward nudge, scaled by how close to the lip it is. Only bites below
// GRIP_SPD, so a well struck ball still sails off the edge as before.
const GRIP_W = 16, GRIP_PULL = 0.10, GRIP_SPD = 3.2;
function edgeGrip(){
  if(ball.rest) return;
  if(Math.hypot(ball.vx, ball.vy) > GRIP_SPD) return;
  for(const b of B){
    if(b.wall || b.base || b.t==='w' || b.t==='r' || b.w < 24) continue;
    if(Math.abs((ball.y+R) - b.y) > 3) continue;          // must be riding its top
    if(ball.x < b.x-R || ball.x > b.x+b.w+R) continue;
    if(b.t === 'ice') return;                             // ice never grabs — that's the point
    const dL = ball.x - b.x, dR = (b.x+b.w) - ball.x;
    const d  = Math.min(dL, dR);
    if(d > GRIP_W) return;                                 // safely inboard
    const t = Math.min(1, (GRIP_W-d)/GRIP_W);              // 0 inboard → 1 at the lip
    ball.vx *= (1 - 0.06*t);
    ball.vx += (dL < dR ? 1 : -1) * GRIP_PULL * t;
    return;
  }
}

// slope: treat the ramp face as a clipped half-space and bounce off its normal
function rampCollide(b){
  if(ball.x < b.x-R || ball.x > b.x+b.w+R) return;
  const L = Math.hypot(b.w, b.h);
  const nx = (b.dir > 0 ? -b.h : b.h)/L, ny = -b.w/L;
  const px = b.x, py = b.dir > 0 ? b.y+b.h : b.y;      // a point on the face
  const dist = (ball.x-px)*nx + (ball.y-py)*ny;
  if(dist >= R || dist < -46) return;                   // clear, or well inside the body
  const pen = R-dist;
  ball.x += nx*pen; ball.y += ny*pen;
  const vn = ball.vx*nx + ball.vy*ny;
  if(vn < 0){ ball.vx -= 1.44*vn*nx; ball.vy -= 1.44*vn*ny; }
  const tx = -ny, ty = nx;                              // slopes are fast — barely any drag
  let vt = ball.vx*tx + ball.vy*ty;
  const nvt = vt*0.99;
  ball.vx += (nvt-vt)*tx; ball.vy += (nvt-vt)*ty;
}

function splash(){
  flash('SPLASH! +1 stroke');
  strokes++; total++;
  respawn(ball.homeX, ball.homeY);
  ball.rest = true;
}

// Drop below the tier you already reached and you are set back where you were,
// rather than tumbling all the way down the mountain.
function fellBack(){
  const last = HOLES[hole-1];
  if(!last) return;                            // still on the ground tier
  // 100 clears the lowest ledge on any tier (tightest margin is ~48px) while still
  // firing well before the ball can reach the tier below, ~180px down
  if(ball.y < last.y + 100) return;
  flash('FELL BACK! +1 stroke');
  strokes++; total++;
  respawn(ball.homeX, ball.homeY);
  ball.rest = true;
}

function sink(){
  const h = HOLES[hole];
  if(!h) return;
  const spd = Math.hypot(ball.vx, ball.vy);
  if(Math.abs(ball.x-h.x) < 11 && Math.abs(ball.y - (h.y-R)) < 15 && spd < 5.2){
    flash('HOLE ' + (hole+1) + ' in ' + strokes + '!');
    hole++;
    strokes = 0;
    if(hole >= HOLES.length){ done = true; return; }
    respawn(h.x, h.y-R);
  }
}

function flash(t){ msg = t; msgT = 110; }

function tugCam(){
  if(!ball.rest) camPeek *= 0.9;
  const want = ball.y - VH*0.62 + camPeek;
  cam += (want-cam)*0.11;
  cam = Math.max(-40, Math.min(WH-VH, cam));
  // never let the ball sit so low that a full-power pull runs off the bottom of the canvas
  if(aiming || ball.rest) cam = Math.max(cam, ball.y - VH + MAXPULL + 45);
}

// ------------------------------------------------------------------ drawing

// A jagged silhouette that scrolls slower than the world, for depth. Each repeat
// gets its own noise seed so the same mountains never come around twice, and the
// body fades out downward instead of ending on a hard horizontal edge.
function ridge(depth, rgb, alpha, amp, step, seed){
  const P = 1500;
  const raw = 1400 - cam*depth;
  const base = ((raw % P) + P) % P;
  const idx = Math.floor(raw / P);
  for(let k=-1;k<=1;k++){
    const y0 = base + k*P;
    if(y0 > VH+320 || y0 < -420) continue;
    const s = seed + (k - idx)*13.73;          // unique per repeat
    const g2 = ctx.createLinearGradient(0, y0-amp*1.4, 0, y0+430);
    g2.addColorStop(0,    'rgba('+rgb+','+alpha+')');
    g2.addColorStop(0.42, 'rgba('+rgb+','+(alpha*0.82).toFixed(3)+')');
    g2.addColorStop(1,    'rgba('+rgb+',0)');
    ctx.fillStyle = g2;
    ctx.beginPath(); ctx.moveTo(VX0-10, y0+470);
    for(let x=VX0-10;x<=VX0+VWF+10;x+=step){
      const h = hsh(x*0.021+s)*amp + hsh(x*0.083+s)*amp*0.45 + hsh(x*0.006+s)*amp*0.5;
      ctx.lineTo(x, y0 - h);
    }
    ctx.lineTo(VX0+VWF+10, y0+470); ctx.closePath(); ctx.fill();
  }
}

// Sky palette per biome, blended smoothly so the climb changes colour gradually
// rather than snapping at the biome borders. [high, mid, low] stops.
const SKY_BANDS = [
  {f:0.00, c:['#5a3f2e','#b2703c','#e8b06a']},   // desert floor: dust and heat haze
  {f:0.30, c:['#3f4a76','#8f7f8e','#ddb98a']},
  {f:0.52, c:['#16305e','#3f7fbe','#a9dcf5']},   // green belt: clear blue
  {f:0.78, c:['#0c1c48','#22508f','#7fb6dd']},
  {f:1.00, c:['#050a24','#101f4e','#2f4f86']},   // summit: thin dark air
];
function skyStops(f){
  let i = 0;
  while(i < SKY_BANDS.length-2 && f > SKY_BANDS[i+1].f) i++;
  const a = SKY_BANDS[i], b = SKY_BANDS[i+1];
  const t = Math.max(0, Math.min(1, (f-a.f)/(b.f-a.f)));
  return [0,1,2].map(k => mix(a.c[k], b.c[k], t));
}

function sky(){
  const gr = ctx.createLinearGradient(0,0,0,VH);
  const fTop = altOf(cam), fBot = altOf(cam+VH);
  const top = skyStops(fTop), bot = skyStops(fBot);
  gr.addColorStop(0,   top[0]);
  gr.addColorStop(0.55,top[1]);                  // already rgb() — don't re-mix
  gr.addColorStop(1,   bot[2]);
  ctx.fillStyle = gr; ctx.fillRect(VX0,0,VWF,VH);
  // stars come out in the thin air near the summit
  const starF = (altOf(cam) - 0.62)/0.3;
  if(starF > 0){
    const a = Math.min(1, starF);
    const band = CLIMB*0.42;
    for(let i=0;i<90;i++){
      const sx = VX0 + (i*97)%VWF, sy = (i*173)%band - cam + SUMMIT_Y - band*0.2;
      if(sy>0&&sy<VH){
        const tw = 0.5+0.5*Math.sin(perf/420+i);
        ctx.fillStyle = 'rgba(255,255,255,'+(a*tw*0.9).toFixed(2)+')';
        ctx.fillRect(sx, sy, i%7?1:2, i%7?1:2);
      }
    }
  }
  // bedrock bleed — keeps the horizon solid out to the screen edges on wide displays
  const fy = GROUND_Y-cam;
  if(fy < VH){
    const gTop = Math.max(0, fy);
    ctx.fillStyle = '#3a2412'; ctx.fillRect(VX0, gTop, VWF, VH-gTop);
    if(fy >= 0){ ctx.fillStyle = '#c8a469'; ctx.fillRect(VX0, fy, VWF, 7); }
  }
  // parallax ranges — dunes down low, blue peaks mid, white summits up top
  const fr = altOf(cam + VH*0.5);
  const far  = fr < 0.36 ? '150,116,74'  : fr < 0.72 ? '96,132,180' : '150,178,214';
  const near = fr < 0.36 ? '120,88,52'   : fr < 0.72 ? '58,88,136'  : '96,126,170';
  ridge(0.22, far,  0.40, 150, 16, 3.1);
  ridge(0.42, near, 0.52, 110, 13, 8.7);
  // clouds, two drifting layers
  for(let L=0;L<2;L++){
    const dep = L?0.72:0.5, sz = L?1:0.7;
    ctx.fillStyle = 'rgba(255,255,255,'+(L?0.55:0.32)+')';
    for(let i=0;i<22;i++){
      const cxp = VX0 + ((i*211 + perf*(L?0.006:0.003))%(VWF+140))-70;
      const cyp = (i*337)%WH - cam*dep - (L?0:200);
      if(cyp>-40&&cyp<VH+40){
        ctx.beginPath();
        ctx.ellipse(cxp,cyp,34*sz,11*sz,0,0,7);
        ctx.ellipse(cxp+24*sz,cyp-6*sz,22*sz,9*sz,0,0,7);
        ctx.ellipse(cxp-22*sz,cyp-2*sz,18*sz,8*sz,0,0,7);
        ctx.fill();
      }
    }
  }
}
function mix(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const A=p(a),Bc=p(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(Bc[i]-v)*t)).join(',')+')';
}

// weathered rock face: banded gradient, strata, speckle, ragged underside
function rockFace(x,y,w,h,seed){
  const g2 = ctx.createLinearGradient(0,y,0,y+h);
  g2.addColorStop(0,'#8d5a35'); g2.addColorStop(0.28,'#71462a');
  g2.addColorStop(0.7,'#573520'); g2.addColorStop(1,'#3a2213');
  ctx.fillStyle = g2; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  for(let sy=10; sy<h; sy+=9){                   // strata
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    for(let sx=x; sx<x+w; sx+=26){
      const o = hsh(seed+sy*0.7+sx*0.3);
      ctx.fillRect(sx+o*10, y+sy, 12+o*11, 3);
    }
  }
  for(let i=0;i<w*h/240;i++){                    // speckle
    const o = hsh(seed+i*1.7), o2 = hsh(seed+i*3.9);
    ctx.fillStyle = o>0.55 ? 'rgba(255,220,180,.16)' : 'rgba(0,0,0,.16)';
    ctx.fillRect(x+o*w, y+8+o2*(h-8), 2, 2);
  }
  ctx.restore();
  // ragged underside
  ctx.fillStyle = '#3a2213';
  for(let sx=x; sx<x+w; sx+=9){
    const d = hsh(seed+sx*0.41)*5;
    ctx.fillRect(sx, y+h-1, 9, d);
  }
}
// grass cap with a scalloped, overhanging lip
function grassCap(x,y,w,seed){
  ctx.fillStyle = '#2c8a33';
  for(let sx=x; sx<x+w; sx+=8){                  // hanging scallops
    const d = 3+hsh(seed+sx*0.53)*4;
    ctx.beginPath(); ctx.arc(sx+4, y+6, 4, 0, Math.PI); ctx.fill();
    ctx.fillRect(sx, y+4, 8, d);
  }
  ctx.fillStyle = '#2c8a33'; ctx.fillRect(x,y,w,7);
  ctx.fillStyle = '#46bd45'; ctx.fillRect(x,y,w,3.5);
  ctx.fillStyle = '#74e26d'; ctx.fillRect(x,y,w,1.5);
  ctx.strokeStyle = '#46bd45'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for(let sx=x+2; sx<x+w-1; sx+=7){              // sprigs along the lip
    const o = hsh(seed+sx*0.29);
    if(o<0.45) continue;
    const sw = Math.sin(perf/900+sx*0.2)*1.2;
    ctx.beginPath(); ctx.moveTo(sx, y+1); ctx.lineTo(sx+sw, y-2-o*3); ctx.stroke();
  }
}

// desert cap: baked sand crust over the rock, with dry scrub tufts
function duneCap(x,y,w,seed){
  ctx.fillStyle = '#d9b878';
  for(let sx=x; sx<x+w; sx+=8){                  // crumbling underside
    const d = 2+hsh(seed+sx*0.53)*4;
    ctx.beginPath(); ctx.arc(sx+4, y+6, 4, 0, Math.PI); ctx.fill();
    ctx.fillRect(sx, y+4, 8, d);
  }
  ctx.fillStyle = '#d9b878'; ctx.fillRect(x,y,w,7);
  ctx.fillStyle = '#ecd39a'; ctx.fillRect(x,y,w,3.5);
  ctx.fillStyle = '#f7e7bd'; ctx.fillRect(x,y,w,1.5);
  ctx.strokeStyle = '#9a8a4e'; ctx.lineWidth = 1.2; ctx.lineCap = 'round';
  for(let sx=x+3; sx<x+w-1; sx+=9){              // dry scrub
    const o = hsh(seed+sx*0.29);
    if(o < 0.62) continue;
    const sw = Math.sin(perf/700+sx*0.2)*1.6;
    ctx.beginPath(); ctx.moveTo(sx, y+1);
    ctx.lineTo(sx+sw-2, y-2-o*3); ctx.moveTo(sx, y+1); ctx.lineTo(sx+sw+2, y-1-o*3);
    ctx.stroke();
  }
}

// snow cap for alpine ledges: drifted white crest with icicles hanging beneath
function snowCap(x,y,w,seed){
  ctx.fillStyle = '#cfe0f2';
  for(let sx=x; sx<x+w; sx+=8){                  // drifted underside
    const d = 3+hsh(seed+sx*0.53)*5;
    ctx.beginPath(); ctx.arc(sx+4, y+6, 4.4, 0, Math.PI); ctx.fill();
    ctx.fillRect(sx, y+4, 8, d);
  }
  ctx.fillStyle = '#dceaf7'; ctx.fillRect(x,y,w,8);
  ctx.fillStyle = '#f2f8ff'; ctx.fillRect(x,y,w,4);
  ctx.fillStyle = '#ffffff';
  for(let sx=x; sx<x+w; sx+=7){                  // wind-blown crest
    const h = 1.5+hsh(seed+sx*0.31)*3;
    ctx.fillRect(sx, y-h, 7, h+2);
  }
  ctx.fillStyle = '#bcd6ee';                     // icicles
  for(let sx=x+3; sx<x+w-2; sx+=9){
    const o = hsh(seed+sx*0.77);
    if(o < 0.45) continue;
    const len = 5+o*11;
    ctx.beginPath();
    ctx.moveTo(sx-1.6, y+8); ctx.lineTo(sx+1.6, y+8); ctx.lineTo(sx, y+8+len);
    ctx.closePath(); ctx.fill();
  }
}

function drawBlocks(){
  for(const b of B){
    const y = b.y-cam;
    if(y > VH+80 || y+b.h < -80) continue;
    if(b.wall) continue;                          // side walls invisible
    const seed = b.x*0.37 + b.y*0.11;

    if(b.t==='w'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'#7fd4f2'); g2.addColorStop(0.45,'#2f95d8'); g2.addColorStop(1,'#14548f');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.save(); ctx.beginPath(); ctx.rect(b.x,y,b.w,b.h); ctx.clip();
      for(let i=0;i<3;i++){                       // travelling surface ripples
        ctx.beginPath();
        for(let x=b.x;x<=b.x+b.w;x+=3){
          const yy = y+3+i*4 + Math.sin(x*0.19 + perf/300 + i*1.4)*1.7;
          x===b.x ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
        }
        ctx.strokeStyle = 'rgba(255,255,255,'+(0.5-i*0.14).toFixed(2)+')';
        ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)';    // foam at the walls
      ctx.fillRect(b.x, y+1, 2, b.h-2); ctx.fillRect(b.x+b.w-2, y+1, 2, b.h-2);
      continue;
    }
    if(b.t==='s'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'#f4e3b0'); g2.addColorStop(1,'#cfa95f');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.strokeStyle = 'rgba(160,120,60,.45)'; ctx.lineWidth = 1.5;
      for(let i=0;i<3;i++){                       // wind ripples
        ctx.beginPath();
        for(let x=b.x+2;x<=b.x+b.w-2;x+=4){
          const yy = y+5+i*4 + Math.sin(x*0.22+i)*1.1;
          x===b.x+2 ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(120,88,44,.5)';       // pebbles
      for(let i=0;i<b.w/14;i++) ctx.fillRect(b.x+4+hsh(seed+i)*(b.w-8), y+4+hsh(seed+i*2.3)*8, 2, 2);
      ctx.fillStyle = 'rgba(90,62,26,.28)';       // inner shadow — reads as a basin
      ctx.fillRect(b.x, y, 3, b.h); ctx.fillRect(b.x+b.w-3, y, 3, b.h);
      continue;
    }
    if(b.t==='snow'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'#ffffff'); g2.addColorStop(1,'#c4d8ec');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.fillStyle = 'rgba(150,180,210,.45)';    // scooped drifts
      for(let i=0;i<b.w/12;i++){
        const px2 = b.x+4+hsh(seed+i*1.9)*(b.w-8);
        ctx.beginPath(); ctx.ellipse(px2, y+7+hsh(seed+i*3.3)*5, 5, 2.2, 0, 0, 7); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,255,255,.95)';    // sparkle
      for(let i=0;i<b.w/16;i++){
        const tw = 0.5+0.5*Math.sin(perf/300+i*2.1);
        if(tw>0.75) ctx.fillRect(b.x+5+hsh(seed+i*5.1)*(b.w-10), y+3+hsh(seed+i*7.3)*8, 2, 2);
      }
      continue;
    }
    if(b.t==='ice'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'rgba(206,240,255,.95)'); g2.addColorStop(1,'rgba(120,180,215,.95)');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.save(); ctx.beginPath(); ctx.rect(b.x,y,b.w,b.h); ctx.clip();
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1.2;
      for(let i=0;i<b.w/18;i++){                  // cracks
        const cx0 = b.x+hsh(seed+i*2.7)*b.w, cy0 = y+2+hsh(seed+i*4.3)*(b.h-4);
        ctx.beginPath(); ctx.moveTo(cx0, cy0);
        ctx.lineTo(cx0+6+hsh(seed+i)*10, cy0+3);
        ctx.lineTo(cx0+2+hsh(seed+i*1.3)*14, cy0+8);
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.55)';    // glare band
      ctx.fillRect(b.x, y+1, b.w, 2.5);
      ctx.restore();
      continue;
    }
    if(b.t==='tg'){
      ctx.fillStyle = '#1d5e26'; ctx.fillRect(b.x, y+4, b.w, b.h-4);
      ctx.lineCap = 'round';
      for(let pass=0;pass<2;pass++){              // back blades darker, front lighter
        for(let x=b.x+1;x<b.x+b.w-1;x+=3){
          const o = hsh(seed+x*0.7+pass*9);
          const sway = Math.sin(perf/560 + x*0.35 + pass)*(2.2+pass);
          const hgt = (pass?7:11) + o*6;
          ctx.strokeStyle = pass ? '#2b8a34' : '#43c94d';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x, y+9); ctx.lineTo(x+sway, y+9-hgt); ctx.stroke();
        }
      }
      continue;
    }
    if(b.t==='r'){                                // sloped ramp
      const yTop = y, yBot = y+b.h;
      ctx.save(); ctx.beginPath();
      if(b.dir > 0){ ctx.moveTo(b.x, yBot); ctx.lineTo(b.x+b.w, yTop); ctx.lineTo(b.x+b.w, yBot); }
      else         { ctx.moveTo(b.x, yTop); ctx.lineTo(b.x+b.w, yBot); ctx.lineTo(b.x, yBot); }
      ctx.closePath(); ctx.clip();
      rockFace(b.x, yTop, b.w, b.h+6, seed);
      ctx.restore();
      // grass running down the sloped face
      const x1 = b.x, y1 = b.dir>0 ? yBot-3 : yTop-3;
      const x2 = b.x+b.w, y2 = b.dir>0 ? yTop-3 : yBot-3;
      ctx.lineCap = 'butt';
      const bio = biomeOf(b.y);
      const cap = bio === 'alpine' ? ['#cfe0f2','#e8f2fb','#ffffff']
                : bio === 'desert' ? ['#d9b878','#ecd39a','#f7e7bd']
                                   : ['#2c8a33','#46bd45','#74e26d'];
      ctx.strokeStyle = cap[0]; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.strokeStyle = cap[1]; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x1,y1-1); ctx.lineTo(x2,y2-1); ctx.stroke();
      ctx.strokeStyle = cap[2]; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1,y1-3); ctx.lineTo(x2,y2-3); ctx.stroke();
      continue;
    }
    // grass-topped rock ledge
    ctx.fillStyle = 'rgba(0,0,0,.16)';            // shadow it casts on the air below
    ctx.fillRect(b.x+4, y+b.h+2, b.w, 5);
    rockFace(b.x, y, b.w, b.h, seed);
    if(b.h > 100){                                // deep bedrock: boulders, then darkness
      ctx.save(); ctx.beginPath(); ctx.rect(b.x,y,b.w,b.h); ctx.clip();
      for(let i=0;i<26;i++){
        const bx = b.x+hsh(seed+i*1.3)*b.w, by = y+30+hsh(seed+i*2.7)*(b.h-40);
        const br = 6+hsh(seed+i*4.1)*16;
        ctx.fillStyle = 'rgba(0,0,0,.13)';
        ctx.beginPath(); ctx.ellipse(bx, by, br, br*0.72, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,214,170,.07)';
        ctx.beginPath(); ctx.ellipse(bx-br*0.2, by-br*0.24, br*0.6, br*0.4, 0, 0, 7); ctx.fill();
      }
      const dg = ctx.createLinearGradient(0, y+40, 0, y+b.h);
      dg.addColorStop(0,'rgba(12,7,4,0)'); dg.addColorStop(1,'rgba(12,7,4,.8)');
      ctx.fillStyle = dg; ctx.fillRect(b.x, y+40, b.w, b.h-40);
      ctx.restore();
    }
    if(!b.base){
      const bio = biomeOf(b.y);
      (bio === 'alpine' ? snowCap : bio === 'desert' ? duneCap : grassCap)(b.x, y, b.w, seed);
    }
  }
}

// ------------------------------------------------------------------- scenery
// Trees are decoration only — no collision. Seeded off the ledges themselves so
// they never land on a cup, a hazard, a lip or a ramp.
function seedTrees(){
  TREES.length = 0;                              // re-run whenever the cups move
  const clear = (x,y) => {
    if(HOLES.some(h => Math.abs(h.x-x) < 40 && Math.abs(h.y-y) < 8)) return false;
    return !B.some(b => (b.t!=='g' || b.w<=6) &&
      x > b.x-12 && x < b.x+b.w+12 && Math.abs(b.y-y) < 46);
  };
  for(const b of B){
    if(b.t!=='g' || b.wall || b.base || b.w < 58) continue;
    const floor = b.h > 100;
    const n = floor ? 8 : (b.w > 120 ? 2 : 1);
    for(let i=0;i<n;i++){
      const x = b.x + 12 + (b.w-24)*((i+0.5)/n) + (hsh(b.x+b.y+i*5)-0.5)*20;
      if(x < b.x+10 || x > b.x+b.w-10) continue;
      if(!clear(x, b.y)) continue;
      if(floor && Math.abs(x-TEE.x) < 60) continue;
      const r = hsh(x*3.1 + b.y*0.7);
      const bio = biomeOf(b.y);
      TREES.push({x, y:b.y, bio, pine:r<0.55, s:0.72+r*0.7, seed:x*0.13+b.y*0.07,
                  arms: r<0.4 ? 2 : (r<0.75 ? 1 : 0)});
    }
  }
}

function drawTrees(){
  for(const t of TREES){
    const y = t.y-cam;
    if(y < -110 || y > VH+30) continue;
    const s = t.s, sway = Math.sin(perf/1100 + t.seed)*2.2;
    ctx.fillStyle = 'rgba(0,0,0,.18)';            // root shadow
    ctx.beginPath(); ctx.ellipse(t.x, y+1, 9*s, 3*s, 0, 0, 7); ctx.fill();

    if(t.bio === 'desert'){                       // saguaro cactus
      const H = 34*s, wdt = 6*s;
      const body = ctx.createLinearGradient(t.x-wdt, 0, t.x+wdt, 0);
      body.addColorStop(0,'#2f7a44'); body.addColorStop(0.45,'#41a05a'); body.addColorStop(1,'#256237');
      ctx.fillStyle = body; ctx.lineCap = 'round';
      ctx.fillRect(t.x-wdt, y-H, wdt*2, H);
      ctx.beginPath(); ctx.arc(t.x, y-H, wdt, Math.PI, 0); ctx.fill();
      const arm = (dir, at, len) => {             // elbowed arm
        ctx.strokeStyle = '#37905060'; ctx.lineWidth = wdt*1.7;
        ctx.strokeStyle = '#379050';
        ctx.beginPath();
        ctx.moveTo(t.x + dir*wdt*0.6, y-H*at);
        ctx.lineTo(t.x + dir*wdt*2.6, y-H*at);
        ctx.lineTo(t.x + dir*wdt*2.6, y-H*(at+len));
        ctx.stroke();
      };
      if(t.arms > 0) arm(1, 0.46, 0.28);
      if(t.arms > 1) arm(-1, 0.62, 0.22);
      ctx.strokeStyle = 'rgba(20,60,35,.5)'; ctx.lineWidth = 1;
      for(let i=-1;i<=1;i++){                     // ribs
        ctx.beginPath(); ctx.moveTo(t.x+i*wdt*0.55, y-H+2); ctx.lineTo(t.x+i*wdt*0.55, y-2); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.fillRect(t.x-wdt*0.75, y-H+3, 1.5, H-6);
      continue;
    }

    ctx.fillStyle = '#5a3a22';                    // trunk
    ctx.beginPath();
    ctx.moveTo(t.x-2.5*s, y+1); ctx.lineTo(t.x+2.5*s, y+1);
    ctx.lineTo(t.x+1.4*s+sway*0.3, y-16*s); ctx.lineTo(t.x-1.4*s+sway*0.3, y-16*s);
    ctx.closePath(); ctx.fill();
    const snowy = t.y < SNOWLINE;
    if(t.pine){
      for(let i=0;i<3;i++){
        const cy = y - 12*s - i*11*s, wd = (17-i*4)*s, ht = 16*s;
        const off = sway*(0.4+i*0.28);
        ctx.fillStyle = snowy ? ['#17532a','#1c6531','#22773a'][i] : ['#1e6b2c','#248034','#2b923c'][i];
        ctx.beginPath();
        ctx.moveTo(t.x+off, cy-ht); ctx.lineTo(t.x+wd+off*0.6, cy); ctx.lineTo(t.x-wd+off*0.6, cy);
        ctx.closePath(); ctx.fill();
        if(snowy){                                // snow settled on each tier
          ctx.fillStyle = '#eef6ff';
          ctx.beginPath();
          ctx.moveTo(t.x+off, cy-ht);
          ctx.lineTo(t.x+wd*0.62+off*0.6, cy-ht*0.30);
          ctx.lineTo(t.x+wd*0.30+off*0.6, cy-ht*0.34);
          ctx.lineTo(t.x-wd*0.20+off*0.6, cy-ht*0.16);
          ctx.lineTo(t.x-wd*0.66+off*0.6, cy-ht*0.30);
          ctx.closePath(); ctx.fill();
        }
      }
      if(!snowy){
        ctx.fillStyle = 'rgba(120,225,120,.30)';  // sunlit side
        ctx.beginPath();
        ctx.moveTo(t.x+sway, y-45*s); ctx.lineTo(t.x-4*s+sway, y-30*s); ctx.lineTo(t.x+sway, y-30*s);
        ctx.closePath(); ctx.fill();
      }
    } else {
      const cy = y - 26*s, ox = sway;
      ctx.fillStyle = snowy ? '#1c5722' : '#256e2a';
      ctx.beginPath();
      ctx.arc(t.x-8*s+ox, cy+4*s, 9*s, 0, 7); ctx.arc(t.x+8*s+ox, cy+3*s, 8.5*s, 0, 7);
      ctx.arc(t.x+ox, cy-5*s, 11*s, 0, 7); ctx.fill();
      ctx.fillStyle = snowy ? '#27702e' : '#33903a';
      ctx.beginPath(); ctx.arc(t.x-2*s+ox, cy-4*s, 8*s, 0, 7); ctx.fill();
      ctx.fillStyle = snowy ? 'rgba(238,246,255,.95)' : 'rgba(140,235,130,.45)';
      ctx.beginPath(); ctx.arc(t.x-5*s+ox, cy-9*s, 5.5*s, 0, 7);
      if(snowy){ ctx.arc(t.x+4*s+ox, cy-7*s, 4*s, 0, 7); }
      ctx.fill();
    }
  }
}

// Falling snow in the alpine band. Weather, not terrain — it drifts with the local
// wind so the two effects agree with each other.
function drawSnowfall(){
  const a = Math.min(1, Math.max(0, (altOf(cam+VH*0.5) - 0.66)/0.16));
  if(a <= 0) return;
  const drift = windAt(240, cam + VH/2) * 900;
  for(let i=0;i<120;i++){
    const s1 = hsh(i*1.7), s2 = hsh(i*3.9), s3 = hsh(i*5.3);
    const fall = 26 + s2*54;
    const sy = ((s1*(VH+80) + perf*fall/1000) % (VH+80)) - 40;
    const sx = VX0 + (((s2*VWF) + Math.sin(perf/1400 + i)*16 + perf*drift/9000
                       - cam*0.12) % VWF + VWF*2) % VWF;
    const r = 1 + s3*2.2;
    ctx.fillStyle = 'rgba(255,255,255,'+(a*(0.35+s3*0.5)).toFixed(2)+')';
    ctx.beginPath(); ctx.arc(sx, sy, r, 0, 7); ctx.fill();
  }
}

function drawWinds(){
  for(const w of WINDS){
    const y = w.y-cam;
    if(y > VH+20 || y+w.h < -20) continue;
    const dir = w.ax > 0 ? 1 : -1, str = Math.abs(w.ax);
    const dust = w.bio === 'desert';
    const tint = dust ? '224,182,112' : '255,255,255';
    // faint body so the band's extent is readable
    const g2 = ctx.createLinearGradient(0, y, 0, y+w.h);
    g2.addColorStop(0,  'rgba('+tint+',0)');
    g2.addColorStop(0.5,'rgba('+tint+','+((dust?0.16:0.05)+str*0.5).toFixed(3)+')');
    g2.addColorStop(1,  'rgba('+tint+',0)');
    ctx.fillStyle = g2; ctx.fillRect(w.x, y, w.w, w.h);
    if(dust){                                    // grit tumbling through the storm
      for(let i=0;i<46;i++){
        const s1 = hsh(w.y+i*2.3), s2 = hsh(w.y+i*5.1);
        const p = ((perf*(0.10+str*1.3)/1000) + s1) % 1;
        const gx = dir > 0 ? w.x + p*w.w : w.x + w.w - p*w.w;
        const gy = y + 4 + s2*(w.h-8) + Math.sin(perf/260 + i)*3;
        ctx.fillStyle = 'rgba(196,150,86,'+(0.25+s2*0.45).toFixed(2)+')';
        ctx.fillRect(gx, gy, 1.5+s1*2, 1.5+s1*1.5);
      }
    }
    // streaks racing through
    ctx.lineCap = 'round';
    for(let i=0;i<20;i++){
      const len = 22 + hsh(w.y+i*7.7)*46;
      const ry  = y + 6 + hsh(w.y+i*3.1)*(w.h-12);
      const spd = 0.10 + str*1.5;
      const p   = ((perf*spd/1000) + hsh(w.y+i*1.7)) % 1;
      const rx  = dir > 0 ? w.x - len + p*(w.w+len)
                          : w.x + w.w + len - p*(w.w+len);
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.10+str*1.5).toFixed(2)+')';
      ctx.lineWidth = 1 + hsh(w.y+i*5.3)*1.4;
      ctx.beginPath();
      for(let k=0;k<=len;k+=8){
        const wy = ry + Math.sin((rx+k)*0.05 + perf/400 + i)*1.8;
        k===0 ? ctx.moveTo(rx, wy) : ctx.lineTo(rx+k, wy);
      }
      ctx.stroke();
      if(len > 44){                              // arrowhead on the long streaks
        const hx = rx + (dir>0 ? len : 0);
        ctx.beginPath();
        ctx.moveTo(hx, ry-3.5); ctx.lineTo(hx+dir*6, ry); ctx.lineTo(hx, ry+3.5);
        ctx.stroke();
      }
    }
  }
}

// Waterfalls spilling off ledge edges — decoration, no collision.
// Spill off ledge ends in the green belt, where there is water to spill.
const FALLS = [];
(function pourFalls(){
  const green = B.filter(b => b.t === 'g' && !b.wall && !b.base && b.w >= 80 &&
                              biomeOf(b.y) === 'green');
  for(const b of green){
    if(rnd() > 0.28) continue;
    const left = rnd() < 0.5;
    const x = left ? b.x : b.x + b.w - 34;
    if(x < 0 || x + 34 > 480) continue;
    // find the next solid surface below to land on
    let land = GROUND_Y;
    for(const o of B){
      if(o.wall || o.t === 'r') continue;
      if(o.y <= b.y + 24) continue;
      if(x + 34 < o.x || x > o.x + o.w) continue;
      land = Math.min(land, o.y);
    }
    const h = land - (b.y + 18);
    if(h > 90) FALLS.push({x, y:b.y + 18, w:34, h});
    if(FALLS.length >= 6) return;
  }
})();
function drawFalls(){
  for(const f of FALLS){
    const y = f.y-cam;
    if(y > VH+40 || y+f.h < -40) continue;
    const g2 = ctx.createLinearGradient(f.x,0,f.x+f.w,0);
    g2.addColorStop(0,  'rgba(110,190,235,.50)');
    g2.addColorStop(0.5,'rgba(200,240,255,.80)');
    g2.addColorStop(1,  'rgba(110,190,235,.50)');
    ctx.fillStyle = g2; ctx.fillRect(f.x, y, f.w, f.h);
    ctx.save(); ctx.beginPath(); ctx.rect(f.x,y,f.w,f.h); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.55)';      // falling streaks
    for(let i=0;i<16;i++){
      const sx = f.x+3 + ((i*7.3)%(f.w-6));
      const sy = y + ((perf*0.45 + i*73) % (f.h+40)) - 20;
      ctx.fillRect(sx, sy, 2, 16 + (i%4)*9);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(235,252,255,.9)';       // lip
    ctx.fillRect(f.x, y-4, f.w, 6);
    const by = y+f.h;                             // mist at the base
    for(let i=0;i<9;i++){
      const p = ((perf/900 + i*0.61) % 1);
      ctx.fillStyle = 'rgba(255,255,255,'+(0.3*(1-p)).toFixed(2)+')';
      ctx.beginPath();
      ctx.arc(f.x+f.w/2 + Math.sin(i*2.1)*(12+p*16), by-4-p*18, 5+p*14, 0, 7);
      ctx.fill();
    }
  }
}

function drawFlag(h, active){
  const y = h.y-cam;
  if(y < -120 || y > VH+60) return;
  // cup: pale rim, dark throat
  ctx.fillStyle = '#d8e4c8'; ctx.beginPath();
  ctx.ellipse(h.x, y+1, 12, 4.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0d1a10'; ctx.beginPath();
  ctx.ellipse(h.x, y+1.5, 10, 3.4, 0, 0, 7); ctx.fill();
  if(active){                                    // glow so the live cup reads
    ctx.strokeStyle = 'rgba(255,210,63,'+(0.35+0.25*Math.sin(perf/300)).toFixed(2)+')';
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.ellipse(h.x, y+1, 15, 6, 0, 0, 7); ctx.stroke();
  }
  // pole with a shaded side
  ctx.fillStyle = active ? '#f7f7f7' : '#9aa6bb'; ctx.fillRect(h.x-1.5, y-56, 3, 56);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(h.x+0.5, y-56, 1, 56);
  ctx.fillStyle = active ? '#ffd23f' : '#8892a6';
  ctx.beginPath(); ctx.arc(h.x, y-57, 2.6, 0, 7); ctx.fill();
  // flag, rippling
  const flap = active ? Math.sin(perf/160)*3 : 0;
  const fl2  = active ? Math.sin(perf/160+1.1)*2.4 : 0;
  ctx.fillStyle = active ? '#ff3b30' : '#6b7488';
  ctx.beginPath();
  ctx.moveTo(h.x+1, y-56);
  ctx.quadraticCurveTo(h.x+14, y-55+flap, h.x+27, y-49+fl2);
  ctx.quadraticCurveTo(h.x+14, y-46+flap, h.x+1, y-42);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(h.x+1, y-49); ctx.quadraticCurveTo(h.x+14, y-47+flap, h.x+27, y-49+fl2);
  ctx.quadraticCurveTo(h.x+14, y-46+flap, h.x+1, y-42);
  ctx.closePath(); ctx.fill();
}

function drawBall(){
  const y = ball.y-cam;
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(ball.x, y+R+2, R, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c3ccdd'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#c9d3e4';
  for(let i=0;i<3;i++){
    const a = ball.spin + i*2.1;
    ctx.beginPath(); ctx.arc(ball.x+Math.cos(a)*3.4, y+Math.sin(a)*3.4, 1.4, 0, 7); ctx.fill();
  }
}

// A golf ball wrapped in a circular arrow — the arrowhead sits at the top of the
// ring and points the way the ball will bend. Used on the button and in the menu.
function spinGlyph(cx, cy, r, dir, dark, alpha){
  ctx.save();
  if(alpha != null) ctx.globalAlpha = alpha;
  ctx.fillStyle = dark ? '#12203f' : '#ffffff';       // the ball
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = dark ? 'rgba(255,255,255,.35)' : '#b9c4d8';
  ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = dark ? 'rgba(255,255,255,.4)' : '#c3ccdd';   // dimples
  for(let i=0;i<3;i++){
    const a = i*2.1 + 0.6;
    ctx.beginPath();
    ctx.arc(cx + Math.cos(a)*r*0.42, cy + Math.sin(a)*r*0.42, Math.max(0.9, r*0.16), 0, 7);
    ctx.fill();
  }
  const ring = r + Math.max(4, r*0.55);               // the circular arrow
  ctx.strokeStyle = dark ? '#12203f' : '#ffd23f';
  ctx.lineWidth = Math.max(1.6, r*0.34); ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(cx, cy, ring, -Math.PI/2 + 0.45, -Math.PI/2 - 0.45 + Math.PI*2);
  ctx.stroke();
  ctx.save();                                        // arrowhead at the top
  ctx.translate(cx, cy - ring);
  ctx.rotate(dir < 0 ? Math.PI : 0);
  const hs = Math.max(2.6, r*0.55);
  ctx.beginPath();
  ctx.moveTo(-hs*0.7, -hs); ctx.lineTo(hs*0.9, 0); ctx.lineTo(-hs*0.7, hs);
  ctx.closePath();
  ctx.fillStyle = dark ? '#12203f' : '#ffd23f'; ctx.fill();
  ctx.restore();
  ctx.restore();
}

function drawSpinUI(){
  if(!spinUIVisible()) return;
  const b = spinBtn();
  ctx.fillStyle = spinMenu ? 'rgba(255,210,63,.92)' : 'rgba(8,14,32,.72)';
  ctx.beginPath(); ctx.arc(b.cx, b.cy, b.r, 0, 7); ctx.fill();
  ctx.strokeStyle = spinSel ? '#ffd23f' : 'rgba(207,224,255,.55)';
  ctx.lineWidth = 1.5; ctx.stroke();
  spinGlyph(b.cx, b.cy - (spinSel?1.5:0), 4.6, spinSel < 0 ? -1 : 1, spinMenu);
  if(spinSel){                                   // level pips
    ctx.fillStyle = spinMenu ? '#12203f' : '#ffd23f';
    const n = Math.abs(spinSel);
    for(let i=0;i<n;i++) ctx.fillRect(b.cx - (n*5-2)/2 + i*5, b.cy+9, 3, 3);
  }
  // a hint of the loaded spin orbiting the ball itself
  if(spinSel && !spinMenu){
    ctx.save(); ctx.globalAlpha = 0.3 + 0.18*Math.sin(perf/300);
    ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y-cam, R+7, -Math.PI/2 + 0.5, -Math.PI/2 - 0.5 + Math.PI*2);
    ctx.stroke();
    ctx.save();
    ctx.translate(ball.x, ball.y-cam-(R+7));
    ctx.rotate(spinSel < 0 ? Math.PI : 0);
    ctx.beginPath(); ctx.moveTo(-3,-4); ctx.lineTo(4,0); ctx.lineTo(-3,4);
    ctx.closePath(); ctx.fillStyle = '#ffd23f'; ctx.fill();
    ctx.restore(); ctx.restore();
  }

  if(!spinMenu) return;
  const cells = spinCells();
  const last = cells[cells.length-1];
  const box = {x:cells[0].x-7, y:cells[0].y-7,
               w:(last.x+last.w)-cells[0].x+14, h:(cells[3].y+cells[3].h)-cells[0].y+14};
  ctx.fillStyle = 'rgba(8,14,32,.88)';
  ctx.fillRect(box.x, box.y, box.w, box.h);
  ctx.strokeStyle = 'rgba(120,150,200,.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(box.x, box.y, box.w, box.h);
  for(const c of cells){
    const on = c.val === spinSel;
    ctx.fillStyle = on ? 'rgba(255,210,63,.92)' : 'rgba(40,58,100,.92)';
    ctx.fillRect(c.x, c.y, c.w, c.h);
    const mx = c.x+c.w/2, my = c.y+c.h/2;
    if(c.val === 0){                             // straight: plain ball, no ring
      ctx.fillStyle = on ? '#12203f' : '#ffffff';
      ctx.beginPath(); ctx.arc(mx, my-3, 5, 0, 7); ctx.fill();
      ctx.strokeStyle = on ? '#12203f' : '#cfe0ff'; ctx.lineWidth = 2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(mx, my+4); ctx.lineTo(mx, my+11); ctx.stroke();
      continue;
    }
    spinGlyph(mx, my-3, 5.4, Math.sign(c.val), on);
    ctx.fillStyle = on ? '#12203f' : '#cfe0ff';  // level bars
    const n = Math.abs(c.val);
    for(let i=0;i<n;i++) ctx.fillRect(mx - (n*6-3)/2 + i*6, my+9, 4, 4);
  }
  ctx.fillStyle = 'rgba(207,224,255,.8)';
  ctx.font = 'bold 9px ui-monospace,monospace'; ctx.textAlign = 'right';
  ctx.fillText('L', cells[0].x-9, cells[0].y+21);
  ctx.fillText('R', cells[1].x-9, cells[1].y+21);
  ctx.textAlign = 'left';
}

let aimWind = 0;
function drawAim(){
  if(!aiming){ aimWind = 0; return; }
  const v = pull();
  const p = v.len/MAXPULL;
  // pull line
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(ball.x, ball.y-cam);
  ctx.lineTo(ball.x+v.dx, ball.y+v.dy-cam); ctx.stroke();
  ctx.setLineDash([]);
  // predicted arc — suppressed while the cancel target is armed, since releasing
  // there fires nothing and showing a trajectory would be a lie
  let px = ball.x, py = ball.y, pvx = -v.dx*POWER, pvy = -v.dy*POWER;
  aimWind = 0;
  let pcurve = Math.sign(spinSel) * SPIN_ACC[Math.abs(spinSel)];
  for(let i=0;i<95 && !cancelZone();i++){
    const wnd = windAt(px,py);                   // strongest wind along this line
    if(Math.abs(wnd) > Math.abs(aimWind)) aimWind = wnd;
    pvy += GRAV; pvx += wnd + pcurve; pcurve *= 0.985;
    pvx *= AIRDRAG; pvy *= AIRDRAG;
    px += pvx; py += pvy;
    if(i%4===0){
      const a = (1-i/95);
      ctx.fillStyle = 'rgba(255,255,255,'+(a*0.75).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(px, py-cam, 2.2*a+0.8, 0, 7); ctx.fill();
    }
  }
  // cancel target above the ball — drag back up here to call the shot off
  const armed = cancelZone();
  const kx = ball.x, ky = ball.y - cam - 48;
  ctx.fillStyle = armed ? 'rgba(255,80,64,.95)' : 'rgba(8,14,32,.6)';
  ctx.beginPath(); ctx.arc(kx, ky, 15, 0, 7); ctx.fill();
  ctx.strokeStyle = armed ? '#ffffff' : 'rgba(207,224,255,.55)';
  ctx.lineWidth = 2.4; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(kx-5, ky-5); ctx.lineTo(kx+5, ky+5);
  ctx.moveTo(kx+5, ky-5); ctx.lineTo(kx-5, ky+5);
  ctx.stroke();
  ctx.font = 'bold 9px ui-monospace,monospace'; ctx.textAlign = 'center';
  ctx.fillStyle = armed ? '#ffd23f' : 'rgba(207,224,255,.7)';
  ctx.fillText(armed ? 'RELEASE TO CANCEL' : 'DRAG UP TO CANCEL', kx, ky-21);
  ctx.textAlign = 'left';

  // power meter
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(VX0+14, VH-42, 160, 12);
  ctx.fillStyle = armed ? 'rgba(90,100,120,.6)'
                : p>0.85 ? '#ff5b4a' : p>0.5 ? '#ffd23f' : '#66e06a';
  ctx.fillRect(VX0+16, VH-40, 156*p, 8);
}

function hud(){
  const L = VX0, Rt = VX0+VWF, C = VX0+VWF/2;
  ctx.fillStyle = 'rgba(8,14,32,.72)';
  ctx.fillRect(L,0,VWF,32);
  ctx.fillStyle = '#e8eefc'; ctx.font = 'bold 14px ui-monospace,monospace';
  ctx.textAlign = 'left';
  ctx.fillText('HOLE ' + Math.min(hole+1,HOLES.length) + '/' + HOLES.length, L+12, 21);
  ctx.fillText('STROKES ' + strokes, L+130, 21);
  ctx.textAlign = 'right';
  ctx.fillText('TOTAL ' + total, Rt-94, 21);
  // leaderboard button — a little trophy/podium
  const bb = boardRect(), bcx = bb.x+bb.w/2, bcy = bb.y+bb.h/2;
  ctx.fillStyle = 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(bcx, bcy, 13, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(bcx-7, bcy+1, 4, 5); ctx.fillRect(bcx-2.5, bcy-4, 5, 10);
  ctx.fillRect(bcx+3, bcy-1, 4, 7);
  ctx.fillStyle = '#cfe0ff'; ctx.fillRect(bcx-8, bcy+6, 16, 2);
  // restart button
  const b = btnRect(), armed = restartArm > 0;
  ctx.fillStyle = armed ? 'rgba(255,90,70,.92)' : 'rgba(255,255,255,.12)';
  ctx.beginPath(); ctx.arc(b.x+b.w/2, b.y+b.h/2, 13, 0, 7); ctx.fill();
  ctx.strokeStyle = armed ? '#fff' : '#cfe0ff';
  ctx.lineWidth = 2; ctx.lineCap = 'round';
  const cx = b.x+b.w/2, cy = b.y+b.h/2;
  ctx.beginPath(); ctx.arc(cx, cy, 7, 0.6, 5.4); ctx.stroke();
  ctx.beginPath();                                  // arrowhead on the circular arrow
  ctx.moveTo(cx+3.5, cy-8.5); ctx.lineTo(cx+7.5, cy-5.5); ctx.lineTo(cx+2.5, cy-3);
  ctx.stroke();
  if(armed) restartArm--;
  // wind readout — live wind on a ball in flight, strongest on the aimed line
  const wnd = aiming ? aimWind : (ball.rest ? 0 : windAt(ball.x, ball.y));
  if(wnd !== 0){
    const dir = wnd > 0 ? 1 : -1, bars = Math.min(4, Math.round(Math.abs(wnd)/0.035));
    ctx.fillStyle = 'rgba(8,14,32,.72)'; ctx.fillRect(C-58, 34, 116, 20);
    ctx.fillStyle = '#9fd8ff'; ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.textAlign = 'left'; ctx.fillText('WIND', C-50, 48);
    ctx.strokeStyle = Math.abs(wnd) > 0.1 ? '#ff9d4a' : '#9fd8ff';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(let i=0;i<bars;i++){
      const ax = C-8 + i*13, hx = dir > 0 ? ax+9 : ax;
      ctx.beginPath(); ctx.moveTo(ax, 44); ctx.lineTo(ax+9, 44);
      ctx.moveTo(hx-dir*4, 41); ctx.lineTo(hx, 44); ctx.lineTo(hx-dir*4, 47);
      ctx.stroke();
    }
    ctx.textAlign = 'left';
  }
  // altitude bar
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(Rt-6, 40, 3, VH-90);
  const f = 1 - (ball.y/WH);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(Rt-8, 40 + (1-f)*(VH-90) - 3, 7, 6);

  if(msgT > 0){
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, msgT/40);
    ctx.font = 'bold 22px ui-monospace,monospace';
    ctx.fillStyle = '#000'; ctx.fillText(msg, C+2, 120);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(msg, C, 118);
    ctx.globalAlpha = 1; msgT--;
  }
  // the finished-run content lives in the DOM panel; the canvas just dims behind it
  if(done){ ctx.fillStyle = 'rgba(5,8,20,.7)'; ctx.fillRect(VX0,0,VWF,VH); }
  ctx.textAlign = 'left';
}

// abandonedBaby Games wordmark: a golf ball moon over the studio name
function wordmark(cx, cy, a){
  ctx.save();
  ctx.globalAlpha = a;
  ctx.textAlign = 'center';
  // ball, with its crescent shadow
  ctx.fillStyle = '#e8eefc';
  ctx.beginPath(); ctx.arc(cx, cy-24, 11, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(20,30,55,.55)';
  ctx.beginPath(); ctx.arc(cx+4, cy-25, 9.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#c3ccdd';
  for(let i=0;i<3;i++){
    const an = 1.1 + i*2.1;
    ctx.beginPath(); ctx.arc(cx+Math.cos(an)*4.5, cy-24+Math.sin(an)*4.5, 1.5, 0, 7); ctx.fill();
  }
  ctx.font = 'bold 15px ui-monospace,monospace';
  ctx.fillStyle = '#9ab0d8';
  ctx.fillText('abandonedBaby', cx, cy);
  ctx.font = 'bold 11px ui-monospace,monospace';
  ctx.fillStyle = '#6c7fa4';
  ctx.fillText('G A M E S', cx, cy+16);
  ctx.restore();
  ctx.textAlign = 'left';
}

// ------------------------------------------------------------- panel + share
const $ = id => document.getElementById(id);

function renderBoard(){
  const rows = loadScores(), el = $('pBoard');
  el.innerHTML = '';
  if(!rows.length){
    el.innerHTML = '<span class="empty">' +
      (storageOK() ? 'No scores yet — finish a run to get on the board.'
                   : 'Scores can\'t be saved in this browser mode.') + '</span>';
    return;
  }
  rows.forEach((r,i) => {
    const li = document.createElement('li');
    if(i === lastRank) li.className = 'me';
    const rk = document.createElement('span'); rk.className = 'rk'; rk.textContent = (i+1)+'.';
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = r.n;
    const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = r.s;
    li.append(rk, nm, sc);                      // textContent, so names can't inject markup
    el.append(li);
  });
}
function openPanel(isEnd){
  panelUp = true;
  const finished = !!isEnd;
  $('pTitle').textContent = finished ? 'SUMMIT REACHED' : 'HIGH SCORES';
  $('pSub').innerHTML = finished
    ? 'Total strokes: <b>'+total+'</b> over '+HOLES.length+' holes'
    : 'Fewest strokes wins · this device';
  $('entry').style.display = finished ? 'flex' : 'none';
  $('pAgain').textContent = finished ? 'PLAY AGAIN' : 'CLOSE';
  $('pName').value = savedName();
  $('pSave').disabled = false; $('pSave').textContent = 'SAVE';
  $('pNote').textContent = '';
  renderBoard();
  $('panel').classList.add('on');
  if(finished && storageOK()) setTimeout(() => $('pName').focus(), 60);
}
function closePanel(){ hidePanel(); }

$('pSave').onclick = () => {
  if(scoreSaved || !done) return;
  if(!storageOK()){ $('pNote').textContent = 'Storage unavailable — score not saved.'; return; }
  const {top, row} = addScore($('pName').value, total);   // addScore normalises the name
  lastRank = top.findIndex(r => r.d === row.d);
  scoreSaved = true;
  $('pSave').disabled = true; $('pSave').textContent = 'SAVED';
  $('pNote').textContent = lastRank >= 0 ? 'Placed #'+(lastRank+1)+' on the board.'
                                         : 'Not in the top '+BOARD_MAX+' this time.';
  renderBoard();
};
$('pName').addEventListener('keydown', e => { if(e.key === 'Enter') $('pSave').click(); });
$('pClose').onclick = () => closePanel();
$('pAgain').onclick = () => { closePanel(); if(done) reset(); };
$('pShare').onclick = () => shareImage();

// Draws the shareable badge: a square medal card, not a screenshot.
function buildBadge(){
  const S = 1080, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d'), u = S/100;
  const F = (sz,b) => (b?'bold ':'') + (u*sz) + 'px ui-monospace,Menlo,Consolas,monospace';

  // backdrop: alpine night sky
  const bg = g.createLinearGradient(0,0,0,S);
  bg.addColorStop(0,'#0a1030'); bg.addColorStop(0.55,'#152a5c'); bg.addColorStop(1,'#0b1224');
  g.fillStyle = bg; g.fillRect(0,0,S,S);
  for(let i=0;i<90;i++){                            // stars
    const sx = hsh(i*1.7)*S, sy = hsh(i*3.1)*S*0.6;
    g.fillStyle = 'rgba(255,255,255,'+(0.25+hsh(i*5.3)*0.6).toFixed(2)+')';
    g.fillRect(sx, sy, 2.5, 2.5);
  }
  g.fillStyle = 'rgba(70,100,150,.45)';             // peaks
  g.beginPath(); g.moveTo(0,S);
  for(let x=0;x<=S;x+=S/26){
    g.lineTo(x, S*0.66 - hsh(x*0.02)*S*0.16 - hsh(x*0.07)*S*0.07);
  }
  g.lineTo(S,S); g.closePath(); g.fill();
  g.fillStyle = 'rgba(228,240,255,.9)';             // snow caps on the peaks
  for(let x=0;x<=S;x+=S/26){
    const py = S*0.66 - hsh(x*0.02)*S*0.16 - hsh(x*0.07)*S*0.07;
    g.beginPath(); g.moveTo(x-8, py+11); g.lineTo(x, py-2); g.lineTo(x+8, py+11);
    g.closePath(); g.fill();
  }
  g.fillStyle = 'rgba(11,18,36,.72)'; g.fillRect(0,0,S,S);

  // gold ring
  const cx = S/2, cy = S*0.44, rad = S*0.23;
  g.strokeStyle = 'rgba(255,210,63,.28)'; g.lineWidth = u*4.4;
  g.beginPath(); g.arc(cx, cy, rad+u*3.4, 0, 7); g.stroke();
  const ring = g.createLinearGradient(cx-rad, cy-rad, cx+rad, cy+rad);
  ring.addColorStop(0,'#ffe89a'); ring.addColorStop(0.5,'#ffd23f'); ring.addColorStop(1,'#b8891c');
  g.strokeStyle = ring; g.lineWidth = u*2.6;
  g.beginPath(); g.arc(cx, cy, rad, 0, 7); g.stroke();
  const disc = g.createLinearGradient(0, cy-rad, 0, cy+rad);
  disc.addColorStop(0,'#16224a'); disc.addColorStop(1,'#0a1130');
  g.fillStyle = disc; g.beginPath(); g.arc(cx, cy, rad-u*1.4, 0, 7); g.fill();
  for(let i=0;i<44;i++){                            // notched rim
    const an = i/44*Math.PI*2;
    g.fillStyle = i%2 ? 'rgba(255,210,63,.5)' : 'rgba(255,210,63,.16)';
    g.beginPath();
    g.arc(cx+Math.cos(an)*(rad+u*3.4), cy+Math.sin(an)*(rad+u*3.4), u*0.7, 0, 7);
    g.fill();
  }

  // flag + ball emblem, sitting in the upper half of the disc
  const ex = cx, ey = cy - u*11.5;
  g.strokeStyle = '#f2f6ff'; g.lineWidth = u*0.8; g.lineCap = 'round';
  g.beginPath(); g.moveTo(ex+u*3.5, ey-u*7); g.lineTo(ex+u*3.5, ey+u*4); g.stroke();
  g.fillStyle = '#ff3b30';
  g.beginPath(); g.moveTo(ex+u*3.5, ey-u*7);
  g.quadraticCurveTo(ex+u*9, ey-u*6, ex+u*13.5, ey-u*4.4);
  g.quadraticCurveTo(ex+u*9, ey-u*3, ex+u*3.5, ey-u*2.2);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,.18)';            // cup
  g.beginPath(); g.ellipse(ex+u*3.5, ey+u*4.3, u*4.4, u*1.5, 0, 0, 7); g.fill();
  g.fillStyle = '#ffffff';                          // ball
  g.beginPath(); g.arc(ex-u*7, ey+u*2, u*3.4, 0, 7); g.fill();
  g.fillStyle = 'rgba(20,30,55,.35)';
  for(let i=0;i<4;i++){
    const an = 0.7+i*1.5;
    g.beginPath(); g.arc(ex-u*7+Math.cos(an)*u*1.4, ey+u*2+Math.sin(an)*u*1.4, u*0.45, 0, 7); g.fill();
  }

  // the score, big, clear of the emblem
  g.textAlign = 'center';
  g.fillStyle = '#ffd23f'; g.font = F(16,true);
  g.fillText(String(total), cx, cy + u*9);
  g.fillStyle = '#cdd9f0'; g.font = F(3.8,true);
  g.fillText('STROKES', cx, cy + u*16.5);

  // title
  g.fillStyle = '#f2f6ff'; g.font = F(7.6,true);
  g.fillText('CLIFF GOLF', cx, u*13.5);
  g.fillStyle = '#8fa3c8'; g.font = F(3.2,true);
  g.fillText(HOLES.length + ' HOLES · SUMMIT REACHED', cx, u*19.5);

  // name and footer, below the medal
  const who = (savedName() || '').trim();
  if(who){
    g.fillStyle = '#ffffff'; g.font = F(6,true);
    g.fillText(who, cx, S - u*22);
  }
  if(lastRank === 0){                               // best run on this device
    g.fillStyle = '#ffd23f'; g.font = F(3.4,true);
    g.fillText('◆ PERSONAL BEST ◆', cx, S - u*(who ? 15 : 20));
  }
  g.strokeStyle = 'rgba(255,255,255,.14)'; g.lineWidth = 2;
  g.beginPath(); g.moveTo(u*24, S-u*10.5); g.lineTo(S-u*24, S-u*10.5); g.stroke();
  g.fillStyle = '#7f93b8'; g.font = F(3,true);
  g.fillText('abandonedBaby GAMES', cx, S - u*5);
  return c;
}

// Builds the shareable badge and hands it to the share sheet, or saves it.
async function shareImage(){
  const note = $('pNote');
  try{
    const shot = buildBadge();
    const wasDone = done;
    const blob = await new Promise(r => shot.toBlob(r, 'image/png'));
    if(!blob){ note.textContent = 'Could not build the image.'; return; }
    const file = new File([blob], 'cliff-golf-badge.png', {type:'image/png'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Cliff Golf',
          text: wasDone ? 'I climbed Cliff Golf in '+total+' strokes.' : 'Climbing Cliff Golf.'});
        note.textContent = 'Shared.';
        return;
      }catch(err){
        if(err && err.name === 'AbortError'){ note.textContent = ''; return; }
        // otherwise fall through to download
      }
    }
    const url = URL.createObjectURL(blob);      // fallback: save the PNG
    const a = document.createElement('a');
    a.href = url; a.download = 'cliff-golf-badge.png'; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    note.textContent = 'Badge saved to your downloads.';
  }catch(e){
    note.textContent = 'Share failed: ' + e.message;
  }
}

// studio card on load — fades itself out, and any touch skips it
function intro(){
  if(introT <= 0) return;
  introT--;
  const a = Math.min(1, introT/45);
  ctx.fillStyle = 'rgba(5,8,20,'+(0.9*a).toFixed(3)+')';
  ctx.fillRect(VX0, 0, VWF, VH);
  wordmark(VX0+VWF/2, VH/2, a);
}

let vig = null;
function vignette(){
  const C = VX0+VWF/2;
  if(!vig){
    const rad = Math.max(VH, VWF);
    vig = ctx.createRadialGradient(C, VH/2, rad*0.34, C, VH/2, rad*0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.28)');
  }
  ctx.fillStyle = vig; ctx.fillRect(VX0,0,VWF,VH);
}

let perf = 0;
function drawFrame(){
  sky(); drawWinds(); drawFalls(); drawBlocks(); drawTrees();
  for(let i=0;i<HOLES.length;i++){
    if(i===hole || (i>hole && i<hole+3)) drawFlag(HOLES[i], i===hole);
  }
  drawBirds(); drawBall(); drawSpinUI(); drawAim(); drawSnowfall(); vignette();
}
function loop(t){
  perf = t||0;
  step();
  drawFrame(); hud(); intro();
  if(done && !panelUp) openPanel(true);       // run finished — show the end panel
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Fill the viewport edge to edge on any device. The play column keeps its fixed
// 480-unit width; the screen decides how much world height comes with it. On screens
// too wide for that (landscape desktop) the column is centred and the backdrop bleeds
// out to both edges, so there are never bars.
const MIN_VH = 620;                  // never show less world height than this
function fit(){
  const cw = window.innerWidth, ch = window.innerHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width  = Math.round(cw*dpr);
  cv.height = Math.round(ch*dpr);

  SCALE = cw/VW;                     // first choice: column spans the full width
  if(ch/SCALE < MIN_VH) SCALE = ch/MIN_VH;   // too wide — fit height instead

  VH  = ch/SCALE;
  VWF = cw/SCALE;
  VX0 = (VW - VWF)/2;                // <=0; negative means sky either side of the column

  ctx.setTransform(SCALE*dpr, 0, 0, SCALE*dpr, -VX0*SCALE*dpr, 0);
  ctx.imageSmoothingEnabled = true;
  vig = null;                        // cached gradient depends on viewport size
  if(typeof cam === 'number') cam = Math.max(-40, Math.min(WH-VH, cam));
}
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);
fit();
</script>
