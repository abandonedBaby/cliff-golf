<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliff Golf — Vertical Mini Golf</title>
<style>
  html,body{margin:0;height:100%;background:#0b1020;color:#e8eefc;
    font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#7ec0ee;image-rendering:pixelated;
    box-shadow:0 0 0 3px #0b1020,0 12px 40px #000a;border-radius:4px;touch-action:none}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;
    font-size:12px;color:#8fa3c8;pointer-events:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="480" height="720"></canvas></div>
<div id="hint">drag DOWN from the ball to aim &amp; power up — release to launch · mouse wheel to peek · R = reset shot · mind the birds &amp; wind</div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const VW = 480, VH = 720;
// WH runs well below the floor so the camera can always scroll far enough past the
// tee to leave a full pull-length of screen under the ball
const WW = 480, WH = 4720;          // world size
const GRAV = 0.34, AIRDRAG = 0.999;
const R = 8;                         // ball radius
// shorter pull, proportionally stronger — same 18.6 max launch speed, less mouse travel
const MAXPULL = 150, POWER = 0.124;

// ---------------------------------------------------------------- level data
// types: g=grass/rock  s=sand  w=water  tg=tall grass  r=sloped ramp
const B = [];
const g=(x,y,w,h)=>B.push({x,y,w,h:h||18,t:'g'});

// A hazard set into a ledge, with the ground wrapping up around both ends so it
// sits in a walled basin instead of floating on the surface.
function pit(x,y,w,t){
  const hh = t==='w' ? 10 : 13;                  // hazard depth
  B.push({x, y:y-hh, w, h:hh+8, t});             // hazard, sunk into the ledge top
  B.push({x:x-5, y:y-hh-5, w:5, h:hh+5, t:'g'}); // left lip
  B.push({x:x+w, y:y-hh-5, w:5, h:hh+5, t:'g'}); // right lip
}
// Sloped ramp. dir=+1 rises to the right, dir=-1 falls to the right.
// Surface runs corner to corner; a solid base sits under the low edge.
function ramp(x,y,w,h,dir){
  B.push({x,y,w,h,t:'r',dir});
  g(x, y+h, w, 12);
  B[B.length-1].base = true;      // support block: no grass cap, no trees
}

// ground
// Floor overhangs the walls, and the walls run far above the summit — otherwise a
// big shot off the top tier sails over them and falls outside the world forever.
g(-60,4360,600,360);                           // floor + deep bedrock below it
g(-30,-3000,30,7720); g(480,-3000,30,7720);    // invisible side walls
B[B.length-1].wall = B[B.length-2].wall = true;

// tier 1
g(30,4180,150); ramp(180,4140,60,40,1);
g(240,4140,100); pit(265,4140,60,'s');
g(380,4200,100);
// tier 2
g(0,3960,130); pit(30,3960,70,'w');
g(180,3990,140);
g(390,3930,90);
// tier 3
g(50,3760,120);
g(230,3720,70);
g(350,3790,120); pit(375,3790,70,'tg');
// tier 4
g(0,3560,90);
g(160,3520,150); pit(175,3520,55,'w'); ramp(310,3480,60,40,1);
g(370,3480,90);
// tier 5
g(60,3340,140); pit(155,3340,40,'s');
g(270,3300,90);
g(400,3360,80);
// tier 6
g(0,3120,110);
g(170,3090,120);
g(330,3140,150); pit(360,3140,80,'w');
// tier 7
g(40,2900,90);
g(200,2860,110); ramp(310,2820,50,40,1);
g(340,2910,120); pit(365,2910,70,'s');
// tier 8
g(0,2690,130); pit(25,2690,80,'w');
g(190,2650,120);
g(370,2700,110);
// tier 9
g(70,2470,100);
g(230,2420,100); ramp(330,2380,60,40,1);
g(370,2480,100); pit(390,2480,60,'tg');
// tier 10
g(0,2250,100);
g(140,2220,110);
g(300,2260,90); pit(320,2260,50,'s');
g(430,2200,50);
// tier 11
g(30,2030,90);
g(180,1980,110); ramp(290,1940,60,40,1);
g(320,2030,150); pit(345,2030,100,'w');
// tier 12
g(0,1810,90);
g(150,1770,110);
g(290,1800,80);
g(400,1760,80);
// tier 13
g(50,1580,100); pit(70,1580,60,'s');
g(200,1540,110); ramp(310,1500,60,40,1);
g(360,1590,110); pit(380,1590,70,'tg');
// tier 14
g(0,1360,90);
g(140,1320,110);
g(290,1360,70);
g(400,1310,80);
// tier 15
g(40,1130,100); ramp(140,1090,60,40,1);
g(250,1090,120); pit(255,1090,35,'w');
g(400,1140,80);
// tier 16
g(0,900,100); ramp(100,860,60,40,1);
g(160,860,110);
g(330,900,130); pit(355,900,70,'s');
// tier 17
g(60,670,90); ramp(150,590,60,40,1);
g(230,630,110);
g(390,680,90);
// tier 18 — summit
g(140,430,200); pit(150,430,50,'tg');
g(190,220,130);

// ------------------------------------------------------------------- holes
// each hole = cup position (x, groundY) — sink here to advance
const HOLES = [
  {x: 95, y:4180}, {x:245, y:3990}, {x:110, y:3760}, {x:255, y:3520},
  {x:130, y:3340}, {x:225, y:3090}, {x:245, y:2860}, {x:245, y:2650},
  {x:280, y:2420}, {x:190, y:2220}, {x:225, y:1980}, {x:190, y:1770},
  {x:245, y:1540}, {x:185, y:1320}, {x:330, y:1090}, {x:210, y: 860},
  {x:275, y: 630}, {x:240, y: 430}, {x:250, y: 220},
];

const TEE = {x: 60, y: 4360 - R};

// -------------------------------------------------------------------- wind
// Bands of moving air sitting in the gaps between tiers. They push the ball
// sideways while it is in flight only — a resting ball is never moved. Strength
// climbs as you get higher, and directions alternate so you must read each gap.
const WINDS = [
  {x:  0, y:3380, w:480, h:120, ax: 0.05},
  {x:  0, y:2920, w:480, h:140, ax:-0.06},
  {x:150, y:2470, w:330, h:150, ax: 0.08},
  {x:  0, y:2030, w:320, h:150, ax:-0.09},
  {x:  0, y:1590, w:480, h:150, ax: 0.10},
  {x:120, y:1140, w:360, h:150, ax:-0.11},
  {x:  0, y: 680, w:480, h:160, ax: 0.12},
  {x:  0, y: 260, w:480, h:140, ax:-0.13},
];
function windAt(x,y){
  let ax = 0;
  for(const w of WINDS)
    if(x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) ax += w.ax;
  return ax;
}

// -------------------------------------------------------------------- birds
// patrol the open air between ledges — clip one mid-flight and your shot is done for
// [xLeft, xRight, y, speed, bobAmount]
const BIRDS = [];
const bird=(x0,x1,y,sp,bob)=>BIRDS.push({x0,x1,y,sp,bob:bob||8,
  t:Math.random(), dir:Math.random()<0.5?-1:1, flap:Math.random()*6, oy:0, stun:0, x:x0, cy:y});
bird( 40,300,4060,0.55);
bird(200,450,3860,0.7);
bird( 30,260,3640,0.85, 14);
bird(180,460,3430,0.75);
bird( 20,300,3210,0.95, 16);
bird(150,440,2990,0.85);
bird( 40,320,2770,1.05, 18);
bird(180,460,2550,0.95);
bird( 20,280,2330,1.15, 14);
bird(160,450,2120,1.05, 20);
bird( 30,300,1890,1.25, 16);
bird(170,460,1670,1.15);
bird( 20,290,1450,1.35, 22);
bird(150,440,1220,1.25, 16);
bird( 30,310, 990,1.45, 18);
bird(170,460, 770,1.35, 24);
bird( 40,300, 540,1.55, 20);
bird(140,420, 330,1.45, 18);

function resetBirds(){
  for(const b of BIRDS){ b.stun = 0; b.oy = 0; b.t = Math.random(); }
}
function birdPos(b){
  b.x = b.x0 + (b.x1-b.x0)*b.t;
  b.cy = b.y + Math.sin(perf/420 + b.flap)*b.bob + b.oy;
}
function stepBirds(){
  for(const b of BIRDS){
    const span = b.x1-b.x0;
    if(b.stun > 0){                       // knocked loose — flutter up out of play
      b.stun--; b.oy -= 1.4;
      if(b.stun === 0) b.oy = 0;
    } else if(b.oy < 0){                  // glide back down to the patrol lane
      b.oy = Math.min(0, b.oy + 1.1);
    }
    b.t += (b.sp/span)*b.dir;
    if(b.t > 1){ b.t = 1; b.dir = -1; }
    if(b.t < 0){ b.t = 0; b.dir =  1; }
    b.flap += 0.22;
    birdPos(b);
  }
}
function hitBirds(){
  if(ball.rest) return;
  for(const b of BIRDS){
    if(b.stun > 0 || b.oy < -2) continue;
    const dx = ball.x-b.x, dy = ball.y-b.cy;
    const rad = R + 10;
    if(dx*dx+dy*dy > rad*rad) continue;
    const d = Math.hypot(dx,dy) || 0.001;
    const nx = dx/d, ny = dy/d;
    ball.x = b.x + nx*rad; ball.y = b.cy + ny*rad;
    const vn = ball.vx*nx + ball.vy*ny;
    if(vn < 0){ ball.vx -= 1.7*vn*nx; ball.vy -= 1.7*vn*ny; }
    ball.vx = ball.vx*0.62 + b.dir*0.8;   // bird shoves you off your line
    ball.vy *= 0.62;
    b.stun = 70; b.dir = -b.dir;
    flash('THWACK! bird strike');
    return;
  }
}
function drawBirds(){
  for(const b of BIRDS){
    const y = b.cy-cam;
    if(y < -40 || y > VH+40) continue;
    const face = b.dir;
    const wing = Math.sin(b.flap)*7;
    ctx.save(); ctx.translate(b.x, y); ctx.scale(face, 1);
    // wings
    ctx.strokeStyle = b.stun>0 ? '#8a5a5a' : '#3a4256';
    ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-9, -wing*0.5); ctx.lineTo(-2, 0); ctx.lineTo(9, -wing*0.5);
    ctx.stroke();
    // body
    ctx.fillStyle = b.stun>0 ? '#a86a6a' : '#4a5470';
    ctx.beginPath(); ctx.ellipse(0, 1, 8, 5, 0, 0, 7); ctx.fill();
    // head + beak
    ctx.beginPath(); ctx.arc(6, -3, 4, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffb02e';
    ctx.beginPath(); ctx.moveTo(9,-3); ctx.lineTo(15,-1.5); ctx.lineTo(9,0); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(7.5, -4, 1.3, 0, 7); ctx.fill();
    ctx.restore();
    if(b.stun > 0){                        // dazed stars
      ctx.fillStyle = '#ffd23f';
      for(let i=0;i<3;i++){
        const a = perf/120 + i*2.1;
        ctx.fillRect(b.x + Math.cos(a)*11 - 1, y - 13 + Math.sin(a)*4, 2, 2);
      }
    }
  }
}

// -------------------------------------------------------------------- state
let ball, hole, strokes, total, cam, camPeek, aiming, aimFrom, mouse, done, msg, msgT;

function reset(){
  hole = 0; strokes = 0; total = 0; done = false; camPeek = 0; msg=''; msgT=0;
  resetBirds();
  respawn(TEE.x, TEE.y);
  cam = ball.y - VH*0.65;
}
function respawn(x,y){
  ball = {x, y, vx:0, vy:0, rest:true, sand:false, spin:0};
  ball.homeX = x; ball.homeY = y;
}
reset();

// -------------------------------------------------------------------- input
function toWorld(e){
  const r = cv.getBoundingClientRect();
  const p = e.touches ? e.touches[0] : e;
  // clamped to the canvas so a drag that runs past the screen edge still reads cleanly
  const x = Math.max(-60, Math.min(VW+60, (p.clientX-r.left)*(VW/r.width)));
  const y = Math.max(0, Math.min(VH, (p.clientY-r.top)*(VH/r.height)));
  return { x, y: y+cam };
}
function down(e){
  e.preventDefault();
  if(done) { reset(); return; }
  const m = toWorld(e);
  if(!atRest()) return;
  if(Math.hypot(m.x-ball.x, m.y-ball.y) < 42){ aiming = true; aimFrom = m; mouse = m; }
}
function move(e){ if(aiming){ e.preventDefault(); mouse = toWorld(e); } }
function up(e){
  if(!aiming) return;
  aiming = false;
  const v = pull();
  if(v.len < 12) return;
  ball.vx = -v.dx*POWER; ball.vy = -v.dy*POWER;
  ball.rest = false; strokes++; total++; camPeek = 0;
}
function pull(){
  let dx = mouse.x-ball.x, dy = mouse.y-ball.y;
  let len = Math.hypot(dx,dy);
  if(len > MAXPULL){ dx *= MAXPULL/len; dy *= MAXPULL/len; len = MAXPULL; }
  return {dx,dy,len};
}
cv.addEventListener('mousedown',down); cv.addEventListener('touchstart',down,{passive:false});
window.addEventListener('mousemove',move); window.addEventListener('touchmove',move,{passive:false});
window.addEventListener('mouseup',up); window.addEventListener('touchend',up);
cv.addEventListener('wheel',e=>{ e.preventDefault(); camPeek += e.deltaY*0.6;
  camPeek = Math.max(-1200, Math.min(600, camPeek)); },{passive:false});
window.addEventListener('keydown',e=>{
  if(e.key==='r'||e.key==='R'){ respawn(ball.homeX, ball.homeY); strokes++; total++; }
});

function atRest(){ return ball.rest; }

// ------------------------------------------------------------------ physics
function step(){
  if(done) return;
  stepBirds();
  if(ball.rest){ tugCam(); return; }

  ball.vy += GRAV;
  ball.vx += windAt(ball.x, ball.y);
  ball.vx *= AIRDRAG; ball.vy *= AIRDRAG;

  // substep for tunnelling
  const n = Math.max(1, Math.ceil(Math.hypot(ball.vx,ball.vy)/4));
  for(let i=0;i<n;i++){
    ball.x += ball.vx/n; ball.y += ball.vy/n;
    collide();
    hitBirds();
    fellBack();
    if(done || ball.rest) return;
  }
  edgeGrip();
  ball.spin += ball.vx*0.06;

  // settle — the slow-frame counter is a backstop so a ball nudging along a slope
  // or wedged in a basin can never leave the player unable to take a shot
  const sp = Math.hypot(ball.vx, ball.vy);
  ball.slow = sp < 0.5 ? (ball.slow||0)+1 : 0;
  if((sp < 0.34 && onGround()) || ball.slow > 50){
    ball.vx = ball.vy = 0; ball.rest = true; ball.slow = 0;
    ball.homeX = ball.x; ball.homeY = ball.y;
  }
  sink();
  tugCam();
}

const STICKY = t => t==='s' || t==='tg';         // sand and tall grass both kill momentum
const rampY = (b,x) => {                          // surface height at a given x
  const u = Math.max(0, Math.min(1, (x-b.x)/b.w));
  return b.dir > 0 ? b.y + b.h*(1-u) : b.y + b.h*u;
};

function onGround(){
  for(const b of B){
    if(b.t==='w') continue;
    if(ball.x < b.x-R || ball.x > b.x+b.w+R) continue;
    if(b.t==='r'){ if(Math.abs((ball.y+R) - rampY(b,ball.x)) < 4) return true; continue; }
    if(Math.abs((ball.y+R) - b.y) < 1.6) return true;
  }
  return false;
}

function collide(){
  ball.sand = false;
  for(const b of B){
    if(b.t==='r'){ rampCollide(b); continue; }
    const cx = Math.max(b.x, Math.min(ball.x, b.x+b.w));
    const cy = Math.max(b.y, Math.min(ball.y, b.y+b.h));
    const dx = ball.x-cx, dy = ball.y-cy, d2 = dx*dx+dy*dy;
    if(d2 > R*R) continue;

    if(b.t==='w'){ splash(); return; }

    let d = Math.sqrt(d2) || 0.0001;
    let nx = dx/d, ny = dy/d;
    if(d2 < 0.0001){ ny = -1; nx = 0; }           // deep overlap → push up
    const pen = R-d;
    ball.x += nx*pen; ball.y += ny*pen;

    const vn = ball.vx*nx + ball.vy*ny;
    if(vn < 0){
      const bounce = STICKY(b.t) ? 0.06 : 0.44;
      ball.vx -= (1+bounce)*vn*nx;
      ball.vy -= (1+bounce)*vn*ny;
    }
    // tangential friction
    const f = b.t==='s' ? 0.55 : b.t==='tg' ? 0.66 : 0.985;
    const tx = -ny, ty = nx;
    let vt = ball.vx*tx + ball.vy*ty;
    const nvt = vt*f;
    ball.vx += (nvt-vt)*tx; ball.vy += (nvt-vt)*ty;
    if(STICKY(b.t)) ball.sand = true;
  }
}

// Ledge rims grab at a ball that is trickling toward the drop: a little extra drag
// plus a gentle inward nudge, scaled by how close to the lip it is. Only bites below
// GRIP_SPD, so a well struck ball still sails off the edge as before.
const GRIP_W = 16, GRIP_PULL = 0.10, GRIP_SPD = 3.2;
function edgeGrip(){
  if(ball.rest) return;
  if(Math.hypot(ball.vx, ball.vy) > GRIP_SPD) return;
  for(const b of B){
    if(b.wall || b.base || b.t==='w' || b.t==='r' || b.w < 24) continue;
    if(Math.abs((ball.y+R) - b.y) > 3) continue;          // must be riding its top
    if(ball.x < b.x-R || ball.x > b.x+b.w+R) continue;
    const dL = ball.x - b.x, dR = (b.x+b.w) - ball.x;
    const d  = Math.min(dL, dR);
    if(d > GRIP_W) return;                                 // safely inboard
    const t = Math.min(1, (GRIP_W-d)/GRIP_W);              // 0 inboard → 1 at the lip
    ball.vx *= (1 - 0.06*t);
    ball.vx += (dL < dR ? 1 : -1) * GRIP_PULL * t;
    return;
  }
}

// slope: treat the ramp face as a clipped half-space and bounce off its normal
function rampCollide(b){
  if(ball.x < b.x-R || ball.x > b.x+b.w+R) return;
  const L = Math.hypot(b.w, b.h);
  const nx = (b.dir > 0 ? -b.h : b.h)/L, ny = -b.w/L;
  const px = b.x, py = b.dir > 0 ? b.y+b.h : b.y;      // a point on the face
  const dist = (ball.x-px)*nx + (ball.y-py)*ny;
  if(dist >= R || dist < -46) return;                   // clear, or well inside the body
  const pen = R-dist;
  ball.x += nx*pen; ball.y += ny*pen;
  const vn = ball.vx*nx + ball.vy*ny;
  if(vn < 0){ ball.vx -= 1.44*vn*nx; ball.vy -= 1.44*vn*ny; }
  const tx = -ny, ty = nx;                              // slopes are fast — barely any drag
  let vt = ball.vx*tx + ball.vy*ty;
  const nvt = vt*0.99;
  ball.vx += (nvt-vt)*tx; ball.vy += (nvt-vt)*ty;
}

function splash(){
  flash('SPLASH! +1 stroke');
  strokes++; total++;
  respawn(ball.homeX, ball.homeY);
  ball.rest = true;
}

// Drop below the tier you already reached and you are set back where you were,
// rather than tumbling all the way down the mountain.
function fellBack(){
  const last = HOLES[hole-1];
  if(!last) return;                            // still on the ground tier
  // 100 clears the lowest ledge on any tier (tightest margin is ~48px) while still
  // firing well before the ball can reach the tier below, ~180px down
  if(ball.y < last.y + 100) return;
  flash('FELL BACK! +1 stroke');
  strokes++; total++;
  respawn(ball.homeX, ball.homeY);
  ball.rest = true;
}

function sink(){
  const h = HOLES[hole];
  if(!h) return;
  const spd = Math.hypot(ball.vx, ball.vy);
  if(Math.abs(ball.x-h.x) < 11 && Math.abs(ball.y - (h.y-R)) < 15 && spd < 5.2){
    flash('HOLE ' + (hole+1) + ' in ' + strokes + '!');
    hole++;
    strokes = 0;
    if(hole >= HOLES.length){ done = true; return; }
    respawn(h.x, h.y-R);
  }
}

function flash(t){ msg = t; msgT = 110; }

function tugCam(){
  if(!ball.rest) camPeek *= 0.9;
  const want = ball.y - VH*0.62 + camPeek;
  cam += (want-cam)*0.11;
  cam = Math.max(-40, Math.min(WH-VH, cam));
  // never let the ball sit so low that a full-power pull runs off the bottom of the canvas
  if(aiming || ball.rest) cam = Math.max(cam, ball.y - VH + MAXPULL + 45);
}

// ------------------------------------------------------------------ drawing
const hsh = n => { const v = Math.sin(n*127.1)*43758.5453; return v - Math.floor(v); };

// a tiling jagged silhouette that scrolls slower than the world, for depth
function ridge(depth, col, amp, step, seed){
  const P = 1500;
  let base = ((1400 - cam*depth) % P + P) % P;
  ctx.fillStyle = col;
  for(let k=-1;k<=1;k++){
    const y0 = base + k*P;
    if(y0 > VH+260 || y0 < -320) continue;
    ctx.beginPath(); ctx.moveTo(-10, y0+300);
    for(let x=-10;x<=VW+10;x+=step){
      const h = hsh(x*0.021+seed)*amp + hsh(x*0.083+seed)*amp*0.45;
      ctx.lineTo(x, y0 - h);
    }
    ctx.lineTo(VW+10, y0+300); ctx.closePath(); ctx.fill();
  }
}

function sky(){
  const gr = ctx.createLinearGradient(0,0,0,VH);
  const t = 1 - Math.max(0, Math.min(1, cam/(WH-VH)));   // 0 top .. 1 bottom
  gr.addColorStop(0,   mix('#0a1338','#6fb7e8', t));
  gr.addColorStop(0.55,mix('#1c3068','#9ed6f5', t));
  gr.addColorStop(1,   mix('#3b5fa8','#d8f0ff', t));
  ctx.fillStyle = gr; ctx.fillRect(0,0,VW,VH);
  // stars near the top of the map
  if(cam < 1100){
    const a = 1-cam/1100;
    for(let i=0;i<90;i++){
      const sx = (i*97)%VW, sy = (i*173)%1100 - cam;
      if(sy>0&&sy<VH){
        const tw = 0.5+0.5*Math.sin(perf/420+i);
        ctx.fillStyle = 'rgba(255,255,255,'+(a*tw*0.9).toFixed(2)+')';
        ctx.fillRect(sx, sy, i%7?1:2, i%7?1:2);
      }
    }
  }
  // parallax mountains
  ridge(0.22, 'rgba(96,132,180,.40)', 150, 16, 3.1);
  ridge(0.42, 'rgba(58,88,136,.52)',  110, 13, 8.7);
  // clouds, two drifting layers
  for(let L=0;L<2;L++){
    const dep = L?0.72:0.5, sz = L?1:0.7;
    ctx.fillStyle = 'rgba(255,255,255,'+(L?0.55:0.32)+')';
    for(let i=0;i<22;i++){
      const cxp = ((i*211 + perf*(L?0.006:0.003))%(VW+140))-70;
      const cyp = (i*337)%WH - cam*dep - (L?0:200);
      if(cyp>-40&&cyp<VH+40){
        ctx.beginPath();
        ctx.ellipse(cxp,cyp,34*sz,11*sz,0,0,7);
        ctx.ellipse(cxp+24*sz,cyp-6*sz,22*sz,9*sz,0,0,7);
        ctx.ellipse(cxp-22*sz,cyp-2*sz,18*sz,8*sz,0,0,7);
        ctx.fill();
      }
    }
  }
}
function mix(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const A=p(a),Bc=p(b);
  return 'rgb('+A.map((v,i)=>Math.round(v+(Bc[i]-v)*t)).join(',')+')';
}

// weathered rock face: banded gradient, strata, speckle, ragged underside
function rockFace(x,y,w,h,seed){
  const g2 = ctx.createLinearGradient(0,y,0,y+h);
  g2.addColorStop(0,'#8d5a35'); g2.addColorStop(0.28,'#71462a');
  g2.addColorStop(0.7,'#573520'); g2.addColorStop(1,'#3a2213');
  ctx.fillStyle = g2; ctx.fillRect(x,y,w,h);
  ctx.save(); ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip();
  for(let sy=10; sy<h; sy+=9){                   // strata
    ctx.fillStyle = 'rgba(0,0,0,.15)';
    for(let sx=x; sx<x+w; sx+=26){
      const o = hsh(seed+sy*0.7+sx*0.3);
      ctx.fillRect(sx+o*10, y+sy, 12+o*11, 3);
    }
  }
  for(let i=0;i<w*h/240;i++){                    // speckle
    const o = hsh(seed+i*1.7), o2 = hsh(seed+i*3.9);
    ctx.fillStyle = o>0.55 ? 'rgba(255,220,180,.16)' : 'rgba(0,0,0,.16)';
    ctx.fillRect(x+o*w, y+8+o2*(h-8), 2, 2);
  }
  ctx.restore();
  // ragged underside
  ctx.fillStyle = '#3a2213';
  for(let sx=x; sx<x+w; sx+=9){
    const d = hsh(seed+sx*0.41)*5;
    ctx.fillRect(sx, y+h-1, 9, d);
  }
}
// grass cap with a scalloped, overhanging lip
function grassCap(x,y,w,seed){
  ctx.fillStyle = '#2c8a33';
  for(let sx=x; sx<x+w; sx+=8){                  // hanging scallops
    const d = 3+hsh(seed+sx*0.53)*4;
    ctx.beginPath(); ctx.arc(sx+4, y+6, 4, 0, Math.PI); ctx.fill();
    ctx.fillRect(sx, y+4, 8, d);
  }
  ctx.fillStyle = '#2c8a33'; ctx.fillRect(x,y,w,7);
  ctx.fillStyle = '#46bd45'; ctx.fillRect(x,y,w,3.5);
  ctx.fillStyle = '#74e26d'; ctx.fillRect(x,y,w,1.5);
  ctx.strokeStyle = '#46bd45'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  for(let sx=x+2; sx<x+w-1; sx+=7){              // sprigs along the lip
    const o = hsh(seed+sx*0.29);
    if(o<0.45) continue;
    const sw = Math.sin(perf/900+sx*0.2)*1.2;
    ctx.beginPath(); ctx.moveTo(sx, y+1); ctx.lineTo(sx+sw, y-2-o*3); ctx.stroke();
  }
}

function drawBlocks(){
  for(const b of B){
    const y = b.y-cam;
    if(y > VH+80 || y+b.h < -80) continue;
    if(b.wall) continue;                          // side walls invisible
    const seed = b.x*0.37 + b.y*0.11;

    if(b.t==='w'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'#7fd4f2'); g2.addColorStop(0.45,'#2f95d8'); g2.addColorStop(1,'#14548f');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.save(); ctx.beginPath(); ctx.rect(b.x,y,b.w,b.h); ctx.clip();
      for(let i=0;i<3;i++){                       // travelling surface ripples
        ctx.beginPath();
        for(let x=b.x;x<=b.x+b.w;x+=3){
          const yy = y+3+i*4 + Math.sin(x*0.19 + perf/300 + i*1.4)*1.7;
          x===b.x ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
        }
        ctx.strokeStyle = 'rgba(255,255,255,'+(0.5-i*0.14).toFixed(2)+')';
        ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.restore();
      ctx.fillStyle = 'rgba(255,255,255,.55)';    // foam at the walls
      ctx.fillRect(b.x, y+1, 2, b.h-2); ctx.fillRect(b.x+b.w-2, y+1, 2, b.h-2);
      continue;
    }
    if(b.t==='s'){
      const g2 = ctx.createLinearGradient(0,y,0,y+b.h);
      g2.addColorStop(0,'#f4e3b0'); g2.addColorStop(1,'#cfa95f');
      ctx.fillStyle = g2; ctx.fillRect(b.x, y, b.w, b.h);
      ctx.strokeStyle = 'rgba(160,120,60,.45)'; ctx.lineWidth = 1.5;
      for(let i=0;i<3;i++){                       // wind ripples
        ctx.beginPath();
        for(let x=b.x+2;x<=b.x+b.w-2;x+=4){
          const yy = y+5+i*4 + Math.sin(x*0.22+i)*1.1;
          x===b.x+2 ? ctx.moveTo(x,yy) : ctx.lineTo(x,yy);
        }
        ctx.stroke();
      }
      ctx.fillStyle = 'rgba(120,88,44,.5)';       // pebbles
      for(let i=0;i<b.w/14;i++) ctx.fillRect(b.x+4+hsh(seed+i)*(b.w-8), y+4+hsh(seed+i*2.3)*8, 2, 2);
      ctx.fillStyle = 'rgba(90,62,26,.28)';       // inner shadow — reads as a basin
      ctx.fillRect(b.x, y, 3, b.h); ctx.fillRect(b.x+b.w-3, y, 3, b.h);
      continue;
    }
    if(b.t==='tg'){
      ctx.fillStyle = '#1d5e26'; ctx.fillRect(b.x, y+4, b.w, b.h-4);
      ctx.lineCap = 'round';
      for(let pass=0;pass<2;pass++){              // back blades darker, front lighter
        for(let x=b.x+1;x<b.x+b.w-1;x+=3){
          const o = hsh(seed+x*0.7+pass*9);
          const sway = Math.sin(perf/560 + x*0.35 + pass)*(2.2+pass);
          const hgt = (pass?7:11) + o*6;
          ctx.strokeStyle = pass ? '#2b8a34' : '#43c94d';
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(x, y+9); ctx.lineTo(x+sway, y+9-hgt); ctx.stroke();
        }
      }
      continue;
    }
    if(b.t==='r'){                                // sloped ramp
      const yTop = y, yBot = y+b.h;
      ctx.save(); ctx.beginPath();
      if(b.dir > 0){ ctx.moveTo(b.x, yBot); ctx.lineTo(b.x+b.w, yTop); ctx.lineTo(b.x+b.w, yBot); }
      else         { ctx.moveTo(b.x, yTop); ctx.lineTo(b.x+b.w, yBot); ctx.lineTo(b.x, yBot); }
      ctx.closePath(); ctx.clip();
      rockFace(b.x, yTop, b.w, b.h+6, seed);
      ctx.restore();
      // grass running down the sloped face
      const x1 = b.x, y1 = b.dir>0 ? yBot-3 : yTop-3;
      const x2 = b.x+b.w, y2 = b.dir>0 ? yTop-3 : yBot-3;
      ctx.lineCap = 'butt';
      ctx.strokeStyle = '#2c8a33'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
      ctx.strokeStyle = '#46bd45'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(x1,y1-1); ctx.lineTo(x2,y2-1); ctx.stroke();
      ctx.strokeStyle = '#74e26d'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(x1,y1-3); ctx.lineTo(x2,y2-3); ctx.stroke();
      continue;
    }
    // grass-topped rock ledge
    ctx.fillStyle = 'rgba(0,0,0,.16)';            // shadow it casts on the air below
    ctx.fillRect(b.x+4, y+b.h+2, b.w, 5);
    rockFace(b.x, y, b.w, b.h, seed);
    if(b.h > 100){                                // deep bedrock: boulders, then darkness
      ctx.save(); ctx.beginPath(); ctx.rect(b.x,y,b.w,b.h); ctx.clip();
      for(let i=0;i<26;i++){
        const bx = b.x+hsh(seed+i*1.3)*b.w, by = y+30+hsh(seed+i*2.7)*(b.h-40);
        const br = 6+hsh(seed+i*4.1)*16;
        ctx.fillStyle = 'rgba(0,0,0,.13)';
        ctx.beginPath(); ctx.ellipse(bx, by, br, br*0.72, 0, 0, 7); ctx.fill();
        ctx.fillStyle = 'rgba(255,214,170,.07)';
        ctx.beginPath(); ctx.ellipse(bx-br*0.2, by-br*0.24, br*0.6, br*0.4, 0, 0, 7); ctx.fill();
      }
      const dg = ctx.createLinearGradient(0, y+40, 0, y+b.h);
      dg.addColorStop(0,'rgba(12,7,4,0)'); dg.addColorStop(1,'rgba(12,7,4,.8)');
      ctx.fillStyle = dg; ctx.fillRect(b.x, y+40, b.w, b.h-40);
      ctx.restore();
    }
    if(!b.base) grassCap(b.x, y, b.w, seed);
  }
}

// ------------------------------------------------------------------- scenery
// Trees are decoration only — no collision. Seeded off the ledges themselves so
// they never land on a cup, a hazard, a lip or a ramp.
const TREES = [];
(function seedTrees(){
  const clear = (x,y) => {
    if(HOLES.some(h => Math.abs(h.x-x) < 40 && Math.abs(h.y-y) < 8)) return false;
    return !B.some(b => (b.t!=='g' || b.w<=6) &&
      x > b.x-12 && x < b.x+b.w+12 && Math.abs(b.y-y) < 46);
  };
  for(const b of B){
    if(b.t!=='g' || b.wall || b.base || b.w < 58) continue;
    const floor = b.h > 100;
    const n = floor ? 8 : (b.w > 120 ? 2 : 1);
    for(let i=0;i<n;i++){
      const x = b.x + 12 + (b.w-24)*((i+0.5)/n) + (hsh(b.x+b.y+i*5)-0.5)*20;
      if(x < b.x+10 || x > b.x+b.w-10) continue;
      if(!clear(x, b.y)) continue;
      if(floor && Math.abs(x-TEE.x) < 60) continue;
      const r = hsh(x*3.1 + b.y*0.7);
      TREES.push({x, y:b.y, pine:r<0.55, s:0.72+r*0.7, seed:x*0.13+b.y*0.07});
    }
  }
})();

function drawTrees(){
  for(const t of TREES){
    const y = t.y-cam;
    if(y < -110 || y > VH+30) continue;
    const s = t.s, sway = Math.sin(perf/1100 + t.seed)*2.2;
    ctx.fillStyle = 'rgba(0,0,0,.18)';            // root shadow
    ctx.beginPath(); ctx.ellipse(t.x, y+1, 9*s, 3*s, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5a3a22';                    // trunk
    ctx.beginPath();
    ctx.moveTo(t.x-2.5*s, y+1); ctx.lineTo(t.x+2.5*s, y+1);
    ctx.lineTo(t.x+1.4*s+sway*0.3, y-16*s); ctx.lineTo(t.x-1.4*s+sway*0.3, y-16*s);
    ctx.closePath(); ctx.fill();
    if(t.pine){
      for(let i=0;i<3;i++){
        const cy = y - 12*s - i*11*s, wd = (17-i*4)*s, ht = 16*s;
        const off = sway*(0.4+i*0.28);
        ctx.fillStyle = ['#1e6b2c','#248034','#2b923c'][i];
        ctx.beginPath();
        ctx.moveTo(t.x+off, cy-ht); ctx.lineTo(t.x+wd+off*0.6, cy); ctx.lineTo(t.x-wd+off*0.6, cy);
        ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = 'rgba(120,225,120,.30)';    // sunlit side
      ctx.beginPath();
      ctx.moveTo(t.x+sway, y-45*s); ctx.lineTo(t.x-4*s+sway, y-30*s); ctx.lineTo(t.x+sway, y-30*s);
      ctx.closePath(); ctx.fill();
    } else {
      const cy = y - 26*s, ox = sway;
      ctx.fillStyle = '#256e2a';
      ctx.beginPath();
      ctx.arc(t.x-8*s+ox, cy+4*s, 9*s, 0, 7); ctx.arc(t.x+8*s+ox, cy+3*s, 8.5*s, 0, 7);
      ctx.arc(t.x+ox, cy-5*s, 11*s, 0, 7); ctx.fill();
      ctx.fillStyle = '#33903a';
      ctx.beginPath(); ctx.arc(t.x-2*s+ox, cy-4*s, 8*s, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(140,235,130,.45)';
      ctx.beginPath(); ctx.arc(t.x-5*s+ox, cy-8*s, 4.5*s, 0, 7); ctx.fill();
    }
  }
}

function drawWinds(){
  for(const w of WINDS){
    const y = w.y-cam;
    if(y > VH+20 || y+w.h < -20) continue;
    const dir = w.ax > 0 ? 1 : -1, str = Math.abs(w.ax);
    // faint body so the band's extent is readable
    const g2 = ctx.createLinearGradient(0, y, 0, y+w.h);
    g2.addColorStop(0,  'rgba(255,255,255,0)');
    g2.addColorStop(0.5,'rgba(255,255,255,'+(0.05+str*0.5).toFixed(3)+')');
    g2.addColorStop(1,  'rgba(255,255,255,0)');
    ctx.fillStyle = g2; ctx.fillRect(w.x, y, w.w, w.h);
    // streaks racing through
    ctx.lineCap = 'round';
    for(let i=0;i<20;i++){
      const len = 22 + hsh(w.y+i*7.7)*46;
      const ry  = y + 6 + hsh(w.y+i*3.1)*(w.h-12);
      const spd = 0.10 + str*1.5;
      const p   = ((perf*spd/1000) + hsh(w.y+i*1.7)) % 1;
      const rx  = dir > 0 ? w.x - len + p*(w.w+len)
                          : w.x + w.w + len - p*(w.w+len);
      ctx.strokeStyle = 'rgba(255,255,255,'+(0.10+str*1.5).toFixed(2)+')';
      ctx.lineWidth = 1 + hsh(w.y+i*5.3)*1.4;
      ctx.beginPath();
      for(let k=0;k<=len;k+=8){
        const wy = ry + Math.sin((rx+k)*0.05 + perf/400 + i)*1.8;
        k===0 ? ctx.moveTo(rx, wy) : ctx.lineTo(rx+k, wy);
      }
      ctx.stroke();
      if(len > 44){                              // arrowhead on the long streaks
        const hx = rx + (dir>0 ? len : 0);
        ctx.beginPath();
        ctx.moveTo(hx, ry-3.5); ctx.lineTo(hx+dir*6, ry); ctx.lineTo(hx, ry+3.5);
        ctx.stroke();
      }
    }
  }
}

// Waterfalls spilling off ledge edges — decoration, no collision.
const FALLS = [
  {x:  0, y:3978, w:34, h:390},
  {x:446, y:3158, w:34, h:202},
  {x:436, y:2048, w:34, h:152},
  {x: 40, y:1148, w:34, h:212},
  {x:140, y: 448, w:34, h:222},
];
function drawFalls(){
  for(const f of FALLS){
    const y = f.y-cam;
    if(y > VH+40 || y+f.h < -40) continue;
    const g2 = ctx.createLinearGradient(f.x,0,f.x+f.w,0);
    g2.addColorStop(0,  'rgba(110,190,235,.50)');
    g2.addColorStop(0.5,'rgba(200,240,255,.80)');
    g2.addColorStop(1,  'rgba(110,190,235,.50)');
    ctx.fillStyle = g2; ctx.fillRect(f.x, y, f.w, f.h);
    ctx.save(); ctx.beginPath(); ctx.rect(f.x,y,f.w,f.h); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.55)';      // falling streaks
    for(let i=0;i<16;i++){
      const sx = f.x+3 + ((i*7.3)%(f.w-6));
      const sy = y + ((perf*0.45 + i*73) % (f.h+40)) - 20;
      ctx.fillRect(sx, sy, 2, 16 + (i%4)*9);
    }
    ctx.restore();
    ctx.fillStyle = 'rgba(235,252,255,.9)';       // lip
    ctx.fillRect(f.x, y-4, f.w, 6);
    const by = y+f.h;                             // mist at the base
    for(let i=0;i<9;i++){
      const p = ((perf/900 + i*0.61) % 1);
      ctx.fillStyle = 'rgba(255,255,255,'+(0.3*(1-p)).toFixed(2)+')';
      ctx.beginPath();
      ctx.arc(f.x+f.w/2 + Math.sin(i*2.1)*(12+p*16), by-4-p*18, 5+p*14, 0, 7);
      ctx.fill();
    }
  }
}

function drawFlag(h, active){
  const y = h.y-cam;
  if(y < -120 || y > VH+60) return;
  // cup: pale rim, dark throat
  ctx.fillStyle = '#d8e4c8'; ctx.beginPath();
  ctx.ellipse(h.x, y+1, 12, 4.6, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#0d1a10'; ctx.beginPath();
  ctx.ellipse(h.x, y+1.5, 10, 3.4, 0, 0, 7); ctx.fill();
  if(active){                                    // glow so the live cup reads
    ctx.strokeStyle = 'rgba(255,210,63,'+(0.35+0.25*Math.sin(perf/300)).toFixed(2)+')';
    ctx.lineWidth = 2; ctx.beginPath();
    ctx.ellipse(h.x, y+1, 15, 6, 0, 0, 7); ctx.stroke();
  }
  // pole with a shaded side
  ctx.fillStyle = active ? '#f7f7f7' : '#9aa6bb'; ctx.fillRect(h.x-1.5, y-56, 3, 56);
  ctx.fillStyle = 'rgba(0,0,0,.22)'; ctx.fillRect(h.x+0.5, y-56, 1, 56);
  ctx.fillStyle = active ? '#ffd23f' : '#8892a6';
  ctx.beginPath(); ctx.arc(h.x, y-57, 2.6, 0, 7); ctx.fill();
  // flag, rippling
  const flap = active ? Math.sin(perf/160)*3 : 0;
  const fl2  = active ? Math.sin(perf/160+1.1)*2.4 : 0;
  ctx.fillStyle = active ? '#ff3b30' : '#6b7488';
  ctx.beginPath();
  ctx.moveTo(h.x+1, y-56);
  ctx.quadraticCurveTo(h.x+14, y-55+flap, h.x+27, y-49+fl2);
  ctx.quadraticCurveTo(h.x+14, y-46+flap, h.x+1, y-42);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath();
  ctx.moveTo(h.x+1, y-49); ctx.quadraticCurveTo(h.x+14, y-47+flap, h.x+27, y-49+fl2);
  ctx.quadraticCurveTo(h.x+14, y-46+flap, h.x+1, y-42);
  ctx.closePath(); ctx.fill();
}

function drawBall(){
  const y = ball.y-cam;
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(ball.x, y+R+2, R, 3, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(ball.x, y, R, 0, 7); ctx.fill();
  ctx.strokeStyle = '#c3ccdd'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#c9d3e4';
  for(let i=0;i<3;i++){
    const a = ball.spin + i*2.1;
    ctx.beginPath(); ctx.arc(ball.x+Math.cos(a)*3.4, y+Math.sin(a)*3.4, 1.4, 0, 7); ctx.fill();
  }
}

let aimWind = 0;
function drawAim(){
  if(!aiming){ aimWind = 0; return; }
  const v = pull();
  const p = v.len/MAXPULL;
  // pull line
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2;
  ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(ball.x, ball.y-cam);
  ctx.lineTo(ball.x+v.dx, ball.y+v.dy-cam); ctx.stroke();
  ctx.setLineDash([]);
  // predicted arc
  let px = ball.x, py = ball.y, pvx = -v.dx*POWER, pvy = -v.dy*POWER;
  aimWind = 0;
  for(let i=0;i<95;i++){
    const wnd = windAt(px,py);                   // strongest wind along this line
    if(Math.abs(wnd) > Math.abs(aimWind)) aimWind = wnd;
    pvy += GRAV; pvx += wnd; pvx *= AIRDRAG; pvy *= AIRDRAG;
    px += pvx; py += pvy;
    if(i%4===0){
      const a = (1-i/95);
      ctx.fillStyle = 'rgba(255,255,255,'+(a*0.75).toFixed(2)+')';
      ctx.beginPath(); ctx.arc(px, py-cam, 2.2*a+0.8, 0, 7); ctx.fill();
    }
  }
  // power meter
  ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(14, VH-42, 160, 12);
  ctx.fillStyle = p>0.85 ? '#ff5b4a' : p>0.5 ? '#ffd23f' : '#66e06a';
  ctx.fillRect(16, VH-40, 156*p, 8);
}

function hud(){
  ctx.fillStyle = 'rgba(8,14,32,.72)';
  ctx.fillRect(0,0,VW,32);
  ctx.fillStyle = '#e8eefc'; ctx.font = 'bold 14px ui-monospace,monospace';
  ctx.textAlign = 'left';
  ctx.fillText('HOLE ' + Math.min(hole+1,HOLES.length) + '/' + HOLES.length, 12, 21);
  ctx.fillText('STROKES ' + strokes, 130, 21);
  ctx.textAlign = 'right';
  ctx.fillText('TOTAL ' + total, VW-12, 21);
  // wind readout — live wind on a ball in flight, strongest on the aimed line
  const wnd = aiming ? aimWind : (ball.rest ? 0 : windAt(ball.x, ball.y));
  if(wnd !== 0){
    const dir = wnd > 0 ? 1 : -1, bars = Math.min(4, Math.round(Math.abs(wnd)/0.035));
    ctx.fillStyle = 'rgba(8,14,32,.72)'; ctx.fillRect(VW/2-58, 34, 116, 20);
    ctx.fillStyle = '#9fd8ff'; ctx.font = 'bold 12px ui-monospace,monospace';
    ctx.textAlign = 'left'; ctx.fillText('WIND', VW/2-50, 48);
    ctx.strokeStyle = Math.abs(wnd) > 0.1 ? '#ff9d4a' : '#9fd8ff';
    ctx.lineWidth = 2; ctx.lineCap = 'round';
    for(let i=0;i<bars;i++){
      const ax = VW/2-8 + i*13, hx = dir > 0 ? ax+9 : ax;
      ctx.beginPath(); ctx.moveTo(ax, 44); ctx.lineTo(ax+9, 44);
      ctx.moveTo(hx-dir*4, 41); ctx.lineTo(hx, 44); ctx.lineTo(hx-dir*4, 47);
      ctx.stroke();
    }
    ctx.textAlign = 'left';
  }
  // altitude bar
  ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(VW-6, 40, 3, VH-90);
  const f = 1 - (ball.y/WH);
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(VW-8, 40 + (1-f)*(VH-90) - 3, 7, 6);

  if(msgT > 0){
    ctx.textAlign = 'center';
    ctx.globalAlpha = Math.min(1, msgT/40);
    ctx.font = 'bold 22px ui-monospace,monospace';
    ctx.fillStyle = '#000'; ctx.fillText(msg, VW/2+2, 120);
    ctx.fillStyle = '#ffd23f'; ctx.fillText(msg, VW/2, 118);
    ctx.globalAlpha = 1; msgT--;
  }
  if(done){
    ctx.fillStyle = 'rgba(5,8,20,.82)'; ctx.fillRect(0,0,VW,VH);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f';
    ctx.font = 'bold 30px ui-monospace,monospace';
    ctx.fillText('SUMMIT REACHED', VW/2, VH/2-30);
    ctx.fillStyle = '#e8eefc'; ctx.font = 'bold 18px ui-monospace,monospace';
    ctx.fillText('Total strokes: ' + total, VW/2, VH/2+6);
    ctx.font = '14px ui-monospace,monospace';
    ctx.fillText('click to play again', VW/2, VH/2+40);
  }
  ctx.textAlign = 'left';
}

let vig = null;
function vignette(){
  if(!vig){
    vig = ctx.createRadialGradient(VW/2, VH/2, VH*0.34, VW/2, VH/2, VH*0.78);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,0,0,.28)');
  }
  ctx.fillStyle = vig; ctx.fillRect(0,0,VW,VH);
}

let perf = 0;
function loop(t){
  perf = t||0;
  step();
  sky(); drawWinds(); drawFalls(); drawBlocks(); drawTrees();
  for(let i=0;i<HOLES.length;i++){
    if(i===hole || (i>hole && i<hole+3)) drawFlag(HOLES[i], i===hole);
  }
  drawBirds(); drawBall(); drawAim(); vignette(); hud();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// fit canvas to window height
function fit(){
  const s = Math.min(window.innerWidth/VW, window.innerHeight/VH) * 0.96;
  cv.style.width = (VW*s)+'px'; cv.style.height = (VH*s)+'px';
}
window.addEventListener('resize', fit); fit();
</script>
</body>
